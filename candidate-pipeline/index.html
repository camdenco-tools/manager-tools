<script>

var REFERRAL_EVENTS_REQUIRED=5;
var EMAIL_INFO=[{num:1,title:'Email 1',desc:'Thanks for applying',field:'email1_sent_at'},{num:2,title:'Email 2',desc:'Welcome / onboarding',field:'email2_sent_at'},{num:3,title:'Email 3',desc:'Final steps / apps',field:'email3_sent_at'}];
var VENUE_STATE={FMP:'NJ',BWH:'NJ',ACCC:'NJ',Cure:'NJ',Mann:'PA',Subaru:'PA',Montage:'PA',Villanova:'PA',DE:'DE',SATB:'DE',Kirkwood:'DE'};

var VENUE_CODES=['FMP','Mann','BWH','ACCC','Cure','Subaru','DE','Montage','SATB','Villanova','Kirkwood'];
var STAGE_LABELS={applied:'Applied',contacted:'Contacted',interview_requested:'Interview Requested',interview_scheduled:'Interview Scheduled',hired:'Hired',onboarding:'Onboarding',active:'Active',inactive:'Inactive',rejected:'Rejected'};
var ARCHIVE_DAYS={applied:30,contacted:30,interview_requested:0,interview_scheduled:0,hired:7,onboarding:35,active:14,inactive:14,rejected:7};
/* SHIRT_SIZES: must match the CHECK constraint on candidates.shirt_size and

var SHIRT_SIZES=['XS','S','M','L','XL','2XL','3XL','4XL','5XL'];

   filters on the pipeline page. Those employees live on the home-components page. The

var pcCandidates=[],pcPayRates=[],payRoleNames=[],pcBookings=[],pcRequests=[],pcPrefs=[],pcLinks=[],pcOpenSlots=[],pcLoadError='',pcSelected=null,pcFilter='all',pcSearch='',pcLoading=true,pcShowLegacy=false;

function apiHeaders() {
  return pcAuth.headers();
}
// Escape database and form values before they go into innerHTML.
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function apiHeadersJson() {
  return Object.assign({}, apiHeaders(), {'Content-Type':'application/json'});
}

function daysSince(ts){if(!ts)return 9999;var then=new Date(ts).getTime();var now=Date.now();return Math.floor((now-then)/(1000*60*60*24));}
function isArchived(c){var limit=ARCHIVE_DAYS[c.pipeline_stage];if(!limit)return false;var ref=c.stage_updated_at||c.applied_at;return daysSince(ref)>limit;}

/* sbFetch wraps fetch and THROWS on non-2xx responses so callers' .catch() actually fires.
   Before this fix, a 4xx (RLS denied, missing column, bad filter) still resolved the promise
   and chained .then() blocks ran as if the write succeeded -- which is why hires
   appeared to save but didn't. Any HTTP error now produces a visible failure. */
function sbFetch(path,opts){
  var method=opts&&opts.method?opts.method:'GET';
  var headers=apiHeadersJson();
  if(opts&&opts.prefer)headers['Prefer']=opts.prefer;
  var cfg={method:method,headers:headers};
  if(opts&&opts.body)cfg.body=JSON.stringify(opts.body);
  return fetch(SUPABASE_URL+path,cfg).then(function(r){
    if(!r.ok){
      return r.text().then(function(t){
        var msg='HTTP '+r.status+' on '+method+' '+path;
        if(t)msg+=' -- '+t.slice(0,300);
        var err=new Error(msg);
        err.status=r.status;

      });
    }

  });
}

/* getFiltered: returns the candidates that should be visible given the current filter pill,
   search input, and pcShowLegacy toggle. Legacy-import rows (backfilled employees not hired
   through the pipeline) are hidden from Active/Inactive/All views by default so the pipeline
   page stays focused on actual in-progress candidates. They live on the home-components page.
   Archive view always shows everything regardless of the legacy toggle. */
function getFiltered(){
  var out=[];
  for(var i=0;i<pcCandidates.length;i++){
    var c=pcCandidates[i];
    var archived=isArchived(c);
    var isLegacy=c.legacy_import===true;
    if(pcFilter==='archive'){
      // Archive view: only show archived rows, but exclude legacy rows here when the
      // Legacy toggle is OFF. Legacy rows are always "archived" by their 2020 timestamp
      // and would dominate the Archive tab if we let them through unconditionally.
      // When the toggle is ON, legacy rows surface in the stage tabs (active/inactive/etc),
      // so we don't need them duplicated in Archive too.
      if(!archived)continue;
      if(isLegacy&&pcShowLegacy)continue;
    }else{
      // Stage tabs (all, applied, contacted, ..., active, inactive):
      //   - Non-legacy rows: respect the normal archive filter.
      //   - Legacy rows: skip the archive check entirely when the toggle is ON, since
      //     the whole point of the toggle is to surface legacy people in the stage tabs
      //     even though their stage_updated_at is years old. When toggle is OFF, the
      //     explicit "if(isLegacy&&!pcShowLegacy)continue;" below hides them.
      if(archived&&!(isLegacy&&pcShowLegacy))continue;
      var mf=pcFilter==='all'||c.pipeline_stage===pcFilter;
      if(!mf)continue;
      if(isLegacy&&!pcShowLegacy)continue;
    }
    var s=pcSearch.toLowerCase();
    var fn=(c.first_name+' '+c.last_name).toLowerCase();
    var ms=!pcSearch||fn.indexOf(s)>-1;
    if(ms)out.push(c);
  }
  return out;
}

function countStage(stage){var n=0;for(var i=0;i<pcCandidates.length;i++){if(pcCandidates[i].pipeline_stage===stage)n++;}return n;}
function countHiredThisMonth(){var n=0,now=new Date();for(var i=0;i<pcCandidates.length;i++){var c=pcCandidates[i];if(!c.hired_at)continue;var d=new Date(c.hired_at);if(d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear())n++;}return n;}
function getPunchId(phone){if(!phone)return'';var d=phone.replace(/\D/g,'');return d.length>=4?d.slice(-4):d;}
function formatPhoneDisplay(phone){if(!phone)return'--';var d=phone.replace(/\D/g,'');if(d.length===10)return'('+d.slice(0,3)+') '+d.slice(3,6)+'-'+d.slice(6);if(d.length===11&&d[0]==='1')return'('+d.slice(1,4)+') '+d.slice(4,7)+'-'+d.slice(7);return phone;}
function getVenueStates(venues){if(!venues||venues.length===0)return[];var s={};for(var i=0;i<venues.length;i++){var st=VENUE_STATE[venues[i]];if(st)s[st]=true;}return Object.keys(s);}
function getPayRateByState(state,role){for(var i=0;i<pcPayRates.length;i++){var pr=pcPayRates[i];if(pr.state===state&&pr.role===role)return pr.base_rate;}return null;}
function getHireChecked(prefix,items){var out=[];for(var i=0;i<items.length;i++){var el=document.getElementById(prefix+items[i]);if(el&&el.checked)out.push(items[i]);}return out;}
function getEmailAvailability(c){
  var stage=c.pipeline_stage;
  // Email 1: Thanks for applying. Available from application through interview.
  var e1=stage==='applied'||stage==='contacted'||stage==='interview_requested'||stage==='interview_scheduled';
  // Email 2: Welcome / onboarding paperwork. Available once the person has been hired.
  var e2=stage==='onboarding'||stage==='active'||stage==='inactive';
  // Email 3: Final steps / app downloads. Same stage gating as Email 2.
  // Previously gated on (W-4 done AND I-9 done) but that broke whenever the W-4 flag
  // didn't get set due to bugs on the WordPress side. The manager should decide when
  // someone is ready for app downloads regardless of paperwork flag state.
  var e3=stage==='onboarding'||stage==='active'||stage==='inactive';
  return{e1:e1,e2:e2,e3:e3};
}

/* updateFilterPills: rebuilds the row of filter pills above the candidate list. The Legacy

}

function renderReferralSection(c){
  if(!c.referred_by_employee_id)return '';
  var stage=c.pipeline_stage;
  var isHired=stage==='hired'||stage==='onboarding'||stage==='active'||stage==='inactive';
  var html='<div class="card-section"><div class="section-title">Referral</div>';
  html+='<div class="detail-grid"><div><div class="detail-label">Referred by</div><div class="detail-value">'+esc(c.referred_by_name||'--')+'</div></div></div>';
  if(!isHired){
    html+='<div style="margin-top:10px;font-size:13px;color:#888;">A referral record is created after this candidate is hired, so the bonus can be tracked.</div></div>';
    return html;
  }
  var ref=pcReferralByCand[c.id];
  if(ref===null){
    html+='<div style="margin-top:10px;font-size:13px;color:#888;">Checking referral record&hellip;</div></div>';
    return html;
  }
  if(ref&&ref.id){
    var amt=(ref.bonus_amount!=null)?' &middot; suggested bonus $'+Number(ref.bonus_amount).toFixed(2):'';
    html+='<div style="margin-top:10px;background:#eaf6ec;border:1px solid #7dc98a;border-radius:6px;padding:10px 12px;font-size:13px;color:#1e6b2e;">Referral record created'+amt+' &middot; '+(ref.events_required||REFERRAL_EVENTS_REQUIRED)+' events required. Manage the payout on the Referrals page.</div></div>';
    return html;
  }
  if(!pcAuth.isAdmin()){
    html+='<div style="margin-top:10px;font-size:13px;color:#888;">Admin access required to create the referral record.</div></div>';
    return html;
  }
  var sug=pcReferralSuggestion(c);
  html+='<div style="margin-top:10px;font-size:13px;color:#444;">This hired candidate was referred by an employee. Create the referral record so the bonus can be tracked.</div>';
  html+='<div style="margin-top:6px;font-size:12px;color:#888;">Suggested: '+(sug.position?sug.position:'(no position)')+' &middot; $'+sug.bonus.toFixed(2)+' &middot; '+REFERRAL_EVENTS_REQUIRED+' events. Editable on the Referrals page.</div>';
  html+='<button class="btn btn-green btn-sm" style="margin-top:10px;" id="ref-create-btn" onclick="pcPipeCreateReferral()">Create referral record</button>';
  html+='<div id="ref-create-err" class="error-msg" style="margin-top:6px;"></div>';
  html+='</div>';
  return html;
}

function pcReferralSuggestion(c){
  var hiredRoles=(c.assigned_roles&&c.assigned_roles.length)?c.assigned_roles:[];
  var appliedRoles=(c.roles&&c.roles.length)?c.roles:[];
  var basis=hiredRoles.length?hiredRoles:appliedRoles;
  var isRunner=false;
  for(var i=0;i<basis.length;i++){if(basis[i]===REFERRAL_RUNNER_ROLE){isRunner=true;break;}}
  return {position:basis.length?basis[0]:'',bonus:isRunner?REFERRAL_BONUS_RUNNER:REFERRAL_BONUS_DEFAULT,isRunner:isRunner};
}

function pcReferralCreatorLabel(){
  var u=(typeof pcAuth!=='undefined'&&pcAuth.getUser)?pcAuth.getUser():null;
  return (u&&(u.display_name||u.email))||'pipeline';
}

function pcPipeLoadReferralForSelected(){
  var c=pcSelected;
  if(!c||!c.referred_by_employee_id)return;
  var stage=c.pipeline_stage;
  var isHired=stage==='hired'||stage==='onboarding'||stage==='active'||stage==='inactive';
  if(!isHired)return;
  if(pcReferralByCand.hasOwnProperty(c.id))return;
  pcReferralByCand[c.id]=null;
  sbFetch('/rest/v1/referrals?referred_candidate_id=eq.'+c.id+'&deleted_at=is.null&select=id,bonus_amount,events_required,status&limit=1')
    .then(function(r){return r.json();})
    .then(function(rows){
      pcReferralByCand[c.id]=(rows&&rows[0])?rows[0]:false;
      if(pcSelected&&pcSelected.id===c.id)render();
    })
    .catch(function(err){
      console.warn('Referral fetch failed (non-blocking):',err);
      pcReferralByCand[c.id]=false;
      if(pcSelected&&pcSelected.id===c.id)render();
    });
}

function pcPipeCreateReferral(){
  if(!pcSelected)return;
  var c=pcSelected;
  if(!c.referred_by_employee_id)return;
  var errEl=document.getElementById('ref-create-err');
  if(!pcAuth.isAdmin()){if(errEl)errEl.innerHTML='Admin access required to create referral records.';return;}
  if(!c.punch_id){if(errEl)errEl.innerHTML='This candidate has no punch ID yet -- finish the hire first.';return;}
  var btn=document.getElementById('ref-create-btn');
  if(errEl)errEl.innerHTML='';
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spinner"></span>Creating...';}
  var sug=pcReferralSuggestion(c);
  var creator=pcReferralCreatorLabel();
  sbFetch('/rest/v1/employees?punch_id=eq.'+encodeURIComponent(c.punch_id)+'&select=id&limit=1')
    .then(function(r){return r.json();})
    .then(function(rows){
      var empId=rows&&rows[0]&&rows[0].id;
      if(!empId)throw new Error('Could not find the hired employee record for this candidate.');
      var now=new Date().toISOString();
      var body={
        referrer_employee_id:c.referred_by_employee_id,
        referrer_name:c.referred_by_name||'Unknown',
        referred_candidate_id:c.id,
        referred_employee_id:empId,
        referred_name:c.first_name+' '+c.last_name,
        referred_position:sug.position||null,
        events_required:REFERRAL_EVENTS_REQUIRED,
        bonus_amount:sug.bonus,
        status:'pending',
        created_by:creator,
        created_at:now,
        updated_at:now
      };
      return sbFetch('/rest/v1/referrals',{method:'POST',prefer:'return=representation',body:body});
    })
    .then(function(r){if(!r)return null;return r.json();})
    .then(function(rows){
      var row=(rows&&rows[0])?rows[0]:null;

function pcPipeMoveStage(newStage){
  if(!pcSelected)return;
  var cand=pcSelected,old=cand.pipeline_stage;
  var booking=getBookingForCandidate(cand.id);
  var req=ivOpenRequest(cand.id);
  var failMsg=function(err){
    console.error('Stage move failed:',err);
    alert('Could not change stage to "'+newStage+'". '+(err&&err.status===403?'Permission denied -- send Claude the browser console error.':ivErrMsg(err)));
    loadAll();
  };
  // A booked interview is cancelled through the interview functions, which also move the stage.
  if(old==='interview_scheduled'&&booking&&(newStage==='applied'||newStage==='contacted')){
    if(!confirm('This cancels their scheduled interview and frees the time. The candidate is NOT emailed. Continue?'))return;
    staffAction({action:'cancel',booking_id:booking.id,reason:'Stage moved back to '+newStage+' on the Pipeline',notify:false,stage_to:newStage})
      .then(function(){loadAll();}).catch(failMsg);
    return;
  }
  var pre=Promise.resolve();
  if(req&&(newStage==='applied'||newStage==='contacted')){
    if(!confirm('They have an open interview request. Moving them back declines it, and their interview link stops working. Continue?'))return;
    pre=staffAction({action:'decline',request_id:req.id,note:'Stage moved back to '+newStage+' on the Pipeline'});
  }
  var now=new Date().toISOString();
  var updates={pipeline_stage:newStage,stage_updated_at:now,updated_at:now};
  if(old==='interview_scheduled'){updates.interview_scheduled_at=null;updates.interview_slot_time=null;}
  pre.then(function(){return sbFetch('/rest/v1/candidates?id=eq.'+cand.id,{method:'PATCH',prefer:'return=minimal',body:updates});})
    .then(function(){loadAll();})
    .catch(failMsg);
}

function pcPipeConfirmHire(){
  if(!pcSelected||!pcHireState)return;
  pcHireSyncInputs();
  var st=pcHireState;

  // Build (venue, role) pairs + flat mirrors from the selection.
  var desiredPairs=[];var venueSet={};var roleSet={};
  Object.keys(st.pairs).forEach(function(k){
    if(!st.pairs[k])return;
    var b=k.split('||');
    if(b.length!==2)return;
    desiredPairs.push({venueCode:b[0],roleName:b[1]});
    venueSet[b[0]]=true;roleSet[b[1]]=true;
  });
  var venuesMirror=Object.keys(venueSet);
  var rolesMirror=Object.keys(roleSet);

  var hiredBy=(st.hiredBy||'').trim();
  var homeVenue=st.homeVenue||'';
  var errEl=document.getElementById('hire-err');
  var btn=document.getElementById('hire-confirm-btn');

  if(desiredPairs.length===0){errEl.innerHTML='Please assign at least one venue + role.';return;}
  if(!hiredBy){errEl.innerHTML='Please enter your name.';return;}
  if(!homeVenue){errEl.innerHTML='Please select a home component (or "Doesn\'t apply") for this employee.';return;}

  var punchInput=document.getElementById('hire-punch-input');
  var punch=punchInput?punchInput.value.replace(/\D/g,''):(st.punchOverride||getPunchId(pcSelected.phone));
  if(!/^\d{4}$/.test(punch)){
    errEl.innerHTML='Punch ID must be exactly 4 digits.';
    if(punchInput)punchInput.focus();
    return;
  }
  errEl.innerHTML='';
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spinner"></span>Checking...';}

  // Pre-flight punch_id collision check against employees.
  sbFetch('/rest/v1/employees?punch_id=eq.'+punch+'&select=first_name,last_name,is_active')
    .then(function(r){return r.json();})
    .then(function(rows){
      if(rows&&rows.length>0){
        var existing=rows[0];
        var msg='Punch ID '+punch+' is already used by '+existing.first_name+' '+existing.last_name;
        if(!existing.is_active)msg+=' (inactive)';
        msg+='. Pick a different 4-digit ID.';
        st.punchOverride=punch;
        st.collisionMsg=msg;
        pcPipeRenderHireModal();
        setTimeout(function(){var ni=document.getElementById('hire-punch-input');if(ni){ni.focus();ni.select();}},30);
        return null;
      }
      return doHireWrite(punch,desiredPairs,venuesMirror,rolesMirror,hiredBy,homeVenue);
    })
    .catch(function(err){
      console.error('Hire failed:',err);
      var e=document.getElementById('hire-err');
      var msg='';
      if(err&&err.status===401)msg='Your login session may have expired -- please sign out and back in.';
      else if(err&&err.status===403)msg='Permission denied by the database. Send Claude this message and the browser console error.';
      else if(err&&err.status===400)msg='The database rejected the data. Send Claude this message and the browser console error.';
      else msg='Save failed'+(err&&err.failStep?(' during '+err.failStep):'')+'. Please try again. If it keeps failing, send Claude the browser console error.';
      if(e)e.innerHTML=msg;
      var b=document.getElementById('hire-confirm-btn');
      if(b){b.disabled=false;b.innerHTML='Confirm hire';}
    });
}

function doHireWrite(punch,desiredPairs,venuesMirror,rolesMirror,hiredBy,homeVenue){
  // candidates: keep mirroring the flat arrays for pages that still read them
  // (event workspace, legacy views). starting_pay_rate is intentionally NOT
  // written anymore -- per-venue pay lives in employee_venue_roles /
  // venue_roles and the Hire-details card now reads it from there.
  // home_venue stays on employees only (dropped from candidates in Step 1.1).
  var cu={pipeline_stage:'onboarding',hired:true,hired_at:new Date().toISOString(),hired_by:hiredBy,punch_id:punch,assigned_venues:venuesMirror,assigned_roles:rolesMirror,stage_updated_at:new Date().toISOString(),updated_at:new Date().toISOString()};
  var er={first_name:pcSelected.first_name,last_name:pcSelected.last_name,punch_id:punch,is_active:true,phone:pcSelected.phone,home_venue:homeVenue,shirt_size:pcSelected.shirt_size||null,candidate_id:pcSelected.id};
  ivCloseInterviews(pcSelected.id,'hired').catch(function(err){console.error('Closing interview records on hire failed (hire continues):',err);});
  var failStep='candidates update';
  return sbFetch('/rest/v1/candidates?id=eq.'+pcSelected.id,{method:'PATCH',prefer:'return=minimal',body:cu})
    .then(function(){
      failStep='employees insert';
      // return=representation so we get the new employee id back for the
      // employee_venue_roles write below.
      return sbFetch('/rest/v1/employees',{method:'POST',prefer:'return=representation',body:er});
    })
    .then(function(r){return r.json();})
    .then(function(insRows){
      failStep='employee venue roles';
      var empId=insRows&&insRows[0]&&insRows[0].id;
      if(!empId)throw new Error('Employee insert returned no id');
      // Per-venue eligibility -- the source of truth. setEmployeeVenueRoles
      // resolves venue/role ids internally and stamps created_by.
      return pcRoles.setEmployeeVenueRoles(empId,desiredPairs,hiredBy);
    })
    .then(function(){
      // Drop the cached EVR for this punch so the card re-fetches fresh rows.
      if(punch&&pcEvrByPunch.hasOwnProperty(punch))delete pcEvrByPunch[punch];
      pcHireState=null;
      pcPipeCloseModal(null);
      loadAll();
    })
    .catch(function(err){
      err.failStep=failStep;
      throw err;
    });
}

// ----- Lazy loader: employee_venue_roles for the selected hired candidate -----
// Resolves the employee id from punch_id, then pulls override-aware assignment
// rows via pc-roles.js. Cached by punch_id. Re-renders when it lands.
function pcPipeLoadEvrForSelected(){
  var c=pcSelected;
  if(!c||!c.punch_id)return;
  var stage=c.pipeline_stage;
  var isHiredPlus=stage==='hired'||stage==='onboarding'||stage==='active'||stage==='inactive';
  if(!isHiredPlus)return;
  if(pcEvrByPunch.hasOwnProperty(c.punch_id))return; // loaded or in-flight
  if(!(window.pcRoles&&pcRoles.getEmployeeVenueRoles))return; // module not present
  var punch=c.punch_id;
  pcEvrByPunch[punch]=null; // mark in-flight
  sbFetch('/rest/v1/employees?punch_id=eq.'+encodeURIComponent(punch)+'&select=id,home_venue&limit=1')
    .then(function(r){return r.json();})
    .then(function(rows){
      if(rows&&rows[0])pcHomeByPunch[punch]=rows[0].home_venue||null;
      var empId=rows&&rows[0]&&rows[0].id;
      if(!empId){pcEvrByPunch[punch]=[];if(pcSelected&&pcSelected.punch_id===punch)render();return;}
      return pcRoles.getEmployeeVenueRoles(empId).then(function(evr){
        pcEvrByPunch[punch]=evr||[];
        if(pcSelected&&pcSelected.punch_id===punch)render();
      });
    })
    .catch(function(err){
      console.warn('Employee venue roles fetch failed (non-blocking):',err);
      pcEvrByPunch[punch]=[];
      if(pcSelected&&pcSelected.punch_id===punch)render();
    });
}

// ----- Hire-details assignments render (per-venue, with legacy fallback) -----
// Loaded EVR rows -> per-venue roles + inherited pay (effective_rate).
// Loading -> a brief line (lazy fetch re-renders). Loaded-empty / never-loaded
// -> fall back to the legacy flat arrays + starting_pay_rate blob so older
// hires still display as before.
function renderHireAssignments(c){
  var evr=(c&&c.punch_id)?pcEvrByPunch[c.punch_id]:undefined;
  if(evr===null){
    return '<div style="margin-top:10px;"><div class="detail-label" style="margin-bottom:4px;">Roles &amp; venues</div><div style="font-size:13px;color:#888;">Loading assignments&hellip;</div></div>';
  }
  if(evr&&evr.length>0){
    var byVenue={};
    evr.forEach(function(r){if(!r.is_active)return;if(!r.venue_code||!r.role_name)return;(byVenue[r.venue_code]=byVenue[r.venue_code]||[]).push(r);});
    var codes=Object.keys(byVenue).sort(function(a,b){return (VENUE_LABELS[a]||a).localeCompare(VENUE_LABELS[b]||b);});

/* ── Signed URL fix: handles both signedURL/signedUrl response keys
   and ensures /storage/v1 prefix is present in the returned path ── */
function getSignedUrl(storagePath,callback){
  var h=apiHeadersJson();
  fetch(SUPABASE_URL+'/storage/v1/object/sign/candidate-files/'+storagePath,{
    method:'POST',
    headers:h,
    body:JSON.stringify({expiresIn:3600})
  }).then(function(r){
    if(!r.ok){
      return r.text().then(function(t){throw new Error('Sign failed ('+r.status+'): '+t);});
    }
    return r.json();
  }).then(function(data){
    var signedPath=data.signedURL||data.signedUrl;
    if(signedPath){
      // Supabase returns the path without /storage/v1 prefix; add it if missing
      if(signedPath.indexOf('/storage/v1')!==0){
        signedPath='/storage/v1'+signedPath;
      }
      callback(SUPABASE_URL+signedPath);
    } else {
      console.error('Signing returned no URL:',data);
      callback(null);
    }
  }).catch(function(err){
    console.error('Signed URL error:',err);
    callback(null);
  });
}

  var rawUrl=null;
  if(fk==='resume')rawUrl=c.resume_url;
  else if(fk==='working-papers')rawUrl=c.working_papers_url;
  else rawUrl=c[fk]||null;
  if(!rawUrl)return;
  var sp=null;
  if(rawUrl.indexOf('/candidate-files/')>-1){
    sp=rawUrl.split('/candidate-files/')[1];
    if(sp&&sp.indexOf('?')>-1)sp=sp.split('?')[0];
  } else if(rawUrl.indexOf('://')===-1){
    sp=rawUrl;
  }
  if(!sp){alert('Could not open file. Please try again.');return;}
  getSignedUrl(sp,function(url){
    if(url)window.open(url,'_blank');
    else alert('Could not open file. Please try again.');
  });
}

function pcPipeEditPunchId(){pcEditingPunchId=true;render();}

function pcPipePunchEditChanged(){
  var inp=document.getElementById('punch-edit-input');
  var status=document.getElementById('punch-edit-status');
  if(!inp||!status)return;
  // Strip non-digits, cap at 4
  var digits=inp.value.replace(/\D/g,'').slice(0,4);
  if(inp.value!==digits)inp.value=digits;
  if(digits.length===0){status.innerHTML='';return;}
  if(digits.length<4){
    status.innerHTML='<span style="color:#888;">Need 4 digits</span>';
    return;
  }
  if(digits===pcSelected.punch_id){
    status.innerHTML='<span style="color:#888;">No change -- this is the current ID</span>';
    return;
  }
  // Check availability via employees lookup
  status.innerHTML='<span style="color:#888;">Checking...</span>';
  sbFetch('/rest/v1/employees?punch_id=eq.'+digits+'&select=first_name,last_name,is_active')
    .then(function(r){return r.json();})
    .then(function(rows){
      // Race protection: make sure the input value hasn't changed since we fired
      var currentInp=document.getElementById('punch-edit-input');
      if(!currentInp||currentInp.value!==digits)return;
      var s=document.getElementById('punch-edit-status');
      if(!s)return;
      if(rows&&rows.length>0){
        var existing=rows[0];
        var inactiveTag=existing.is_active?'':' (inactive)';
        s.innerHTML='<span style="color:#c0392b;">&#10007; Already used by '+existing.first_name+' '+existing.last_name+inactiveTag+'</span>';
      } else {
        s.innerHTML='<span style="color:#1D9E75;">&#10003; Available</span>';
      }
    })
    .catch(function(err){
      console.error('Punch availability check failed:',err);
      var s=document.getElementById('punch-edit-status');
      if(s)s.innerHTML='<span style="color:#c0392b;">Could not check availability -- try again</span>';
    });
}

function pcPipeSavePunchId(){
  if(!pcSelected)return;
  var inp=document.getElementById('punch-edit-input');
  var status=document.getElementById('punch-edit-status');
  var btn=document.getElementById('punch-save-btn');
  if(!inp)return;
  var newPunch=inp.value.replace(/\D/g,'');
  if(!/^\d{4}$/.test(newPunch)){
    if(status)status.innerHTML='<span style="color:#c0392b;">Punch ID must be exactly 4 digits</span>';
    return;
  }
  if(newPunch===pcSelected.punch_id){
    pcEditingPunchId=false;
    render();
    return;
  }
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spinner"></span>Saving';}
  var oldPunch=pcSelected.punch_id;
  var now=new Date().toISOString();
  // Re-check availability one more time on save (in case someone took it between typing and clicking)
  sbFetch('/rest/v1/employees?punch_id=eq.'+newPunch+'&select=first_name,last_name')
    .then(function(r){return r.json();})
    .then(function(rows){
      if(rows&&rows.length>0){
        var existing=rows[0];
        throw new Error('Punch ID '+newPunch+' was just taken by '+existing.first_name+' '+existing.last_name+'. Pick another.');
      }
      // Update candidates row
      return sbFetch('/rest/v1/candidates?id=eq.'+pcSelected.id,{method:'PATCH',prefer:'return=minimal',body:{punch_id:newPunch,updated_at:now}});
    })
    .then(function(){
      // Update matching employees row (if it exists)
      if(!oldPunch)return null;
      return sbFetch('/rest/v1/employees?punch_id=eq.'+oldPunch+'&first_name=eq.'+encodeURIComponent(pcSelected.first_name)+'&last_name=eq.'+encodeURIComponent(pcSelected.last_name),{method:'PATCH',prefer:'return=minimal',body:{punch_id:newPunch,updated_at:now}});
    })
    .then(function(){
      pcSelected.punch_id=newPunch;
      pcEditingPunchId=false;
      loadAll();
    })
    .catch(function(err){
      console.error('Punch ID save failed:',err);
      var s=document.getElementById('punch-edit-status');
      if(s)s.innerHTML='<span style="color:#c0392b;">'+(err.message||'Save failed -- try again')+'</span>';
      var b=document.getElementById('punch-save-btn');
      if(b){b.disabled=false;b.innerHTML='Save';}
    });
}

function buildShirtSizeOptions(currentValue){
  var html='<option value="">(not set)</option>';
  for(var i=0;i<SHIRT_SIZES.length;i++){
    var sz=SHIRT_SIZES[i];
    var sel=(currentValue===sz)?' selected':'';

     picker link (only the newest link works; history shown on the card).

     or ask for new times. Scheduled interview: cancel or reschedule.

// ============================================================
// SESSION 6 -- interview notes, references, reference status and
// pre-hire INTEREST (Sept 25, 2026).
//
// Interest (candidate_interests) is what the candidate WANTS, captured
// at interview. Assignment (employee_venue_roles) is what we GIVE, set
// in the hire modal. They are stored separately; the hire modal only
// pre-checks from interest, through the same legality filter it already
// uses (role mapped + active at the venue, no alcohol roles for minors).
// The database also refuses minor + alcohol interest (trigger) and any
// pair not in venue_roles (composite FK).
//
// Notes are append-only: staff can add and soft-delete, never rewrite.
// ref_status is a separate field, not a pipeline stage; marking any
// reference checked clears it.
// ============================================================
var S6_REF_STATUS={waiting_info:'Waiting for ref info',checking:'Checking ref'};
var S6_NOTE_TYPES=[['interview','Interview'],['reference','Reference'],['general','General']];
var S6_MAX_NOTE=4000;
var pcS6={};              // candidate id -> {status:'loading'|'ok'|'error', data:{notes,refs,ints}|null, err:''}
var pcS6Venues=null;      // {byId:{id:code}, byCode:{code:id}}
var pcS6Busy=false;
var pcS6Msg=null;         // {where:'note'|'ref'|'status'|'int', text:'...'}
var pcS6NoteDraft={type:'',body:''};
var pcS6RefForm=null;     // null | 'new' | reference id being edited
var pcS6RefDraft={name:'',relationship:'',phone:'',notes:''};
var pcS6IntVenue=null;    // venue code selected in the interest picker
var pcS6DraftFor=null;    // candidate id the drafts belong to

function pcS6Actor(){return pcReferralCreatorLabel();}
function pcS6IsPreHire(c){return IV_PRE_HIRE.indexOf(c.pipeline_stage||'applied')>-1;}
function s6RefBadge(c){
  if(!c||!c.ref_status||!pcS6IsPreHire(c))return'';
  var st=c.ref_status==='checking'?'background:#e6f1fb;border:1px solid #b3d4f7;color:#185fa5;':'background:#fffbeb;border:1px solid #fcd34d;color:#92400e;';
  return' <span class="badge" style="font-size:10px;'+st+'">'+esc(S6_REF_STATUS[c.ref_status]||c.ref_status)+'</span>';
}

function pcS6LoadVenues(){
  if(pcS6Venues)return Promise.resolve(pcS6Venues);
  return sbJsonList('/rest/v1/venues?select=id,code&limit=500').then(function(rows){
    var byId={},byCode={};
    (rows||[]).forEach(function(v){if(v&&v.id&&v.code){byId[v.id]=v.code;byCode[v.code]=v.id;}});
    pcS6Venues={byId:byId,byCode:byCode};
    return pcS6Venues;
  });
}

function pcS6LoadForSelected(){
  if(!pcSelected)return;
  if(pcS6DraftFor!==pcSelected.id){
    pcS6DraftFor=pcSelected.id;
    pcS6NoteDraft={type:'',body:''};pcS6RefForm=null;pcS6RefDraft={name:'',relationship:'',phone:'',notes:''};pcS6IntVenue=null;pcS6Msg=null;
  }
  if(pcS6[pcSelected.id])return;
  pcS6Load(pcSelected.id);
}

// Loads notes, references and interest for one candidate. Keeps the
// previous data on screen while a refresh is in flight.
function pcS6Load(id){
  var prev=pcS6[id];
  var entry={status:'loading',data:prev?prev.data:null,err:''};
  pcS6[id]=entry;
  var rolesReady=(window.pcRoles&&pcRoles.ready)?pcRoles.ready():Promise.reject(new Error('Role catalog (pc-roles.js) is not loaded.'));
  return Promise.all([
    rolesReady,
    pcS6LoadVenues(),
    sbJsonList('/rest/v1/candidate_notes?candidate_id=eq.'+id+'&deleted_at=is.null&select=id,note_type,body,created_by,created_at&order=created_at.desc&limit=200'),
    sbJsonList('/rest/v1/candidate_references?candidate_id=eq.'+id+'&deleted_at=is.null&select=id,name,relationship,phone,notes,checked_at,checked_by,created_by,created_at,updated_at&order=created_at.asc&limit=50'),
    sbJsonList('/rest/v1/candidate_interests?candidate_id=eq.'+id+'&deleted_at=is.null&select=id,venue_id,role_id,created_by,created_at&order=created_at.asc&limit=200')
  ]).then(function(res){
    if(pcS6[id]!==entry)return entry;
    entry.status='ok';
    entry.data={notes:res[2]||[],refs:res[3]||[],ints:res[4]||[]};
    if(pcSelected&&pcSelected.id===id)render();
    return entry;
  }).catch(function(err){
    console.error('Session 6 load failed:',err);
    if(pcS6[id]!==entry)return entry;
    entry.status='error';
    entry.err=ivErrMsg(err);
    if(pcSelected&&pcSelected.id===id)render();
    return entry;
  });
}
function pcS6Retry(){if(pcSelected){pcS6Load(pcSelected.id);render();}}

// Interest rows resolved to venue code + role name (null parts if the
// catalog no longer knows them).
function pcS6InterestPairs(ints){
  var names={};
  try{pcRoles.getRoles({includeRetired:true}).forEach(function(r){names[r.id]=r.name;});}catch(e){names={};}
  var byId=pcS6Venues?pcS6Venues.byId:{};
  return (ints||[]).map(function(it){
    return {id:it.id,code:byId[it.venue_id]||null,role:names[it.role_id]||null,venue_id:it.venue_id,role_id:it.role_id};
  });
}

function pcS6MsgHtml(where){
  if(!pcS6Msg||pcS6Msg.where!==where)return'';
  return'<div class="error-msg" style="display:block;margin-top:6px;">'+esc(pcS6Msg.text)+'</div>';
}

function renderS6Section(c){
  var e=pcS6[c.id];
  var html='<div class="card-section"><div class="section-title">Interview notes, references &amp; interest</div>';
  if(!e||(!e.data&&e.status==='loading')){
    html+='<p style="font-size:13px;color:#888;margin:0;">Loading...</p>';
  } else if(!e.data&&e.status==='error'){
    html+='<div style="background:#fdecea;border:1px solid #f4b8b8;border-radius:6px;padding:10px 12px;font-size:13px;color:#8b1a1a;">Could not load notes, references and interest.<br>'+esc(e.err)+
      '<br><button class="btn btn-sm" style="margin-top:8px;" onclick="pcS6Retry()">Try again</button></div>';
  } else {
    if(e.status==='error')html+='<div class="error-msg" style="display:block;margin-bottom:8px;">Refresh failed: '+esc(e.err)+' <a href="#" onclick="pcS6Retry();return false;">Try again</a></div>';
    html+=renderS6Notes(c,e.data);
    html+=renderS6Refs(c,e.data);
    html+=renderS6Interest(c,e.data);
  }
  html+='</div>';
  return html;
}

function renderS6Notes(c,d){
  var dis=pcS6Busy?' disabled':'';
  var type=pcS6NoteDraft.type||(pcS6IsPreHire(c)?'interview':'general');
  var opts=S6_NOTE_TYPES.map(function(t){return'<option value="'+t[0]+'"'+(t[0]===type?' selected':'')+'>'+t[1]+'</option>';}).join('');
  var html='<div class="detail-label" style="margin-bottom:6px;">Notes</div>'+
    '<div style="display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;">'+
      '<select id="s6-note-type" onchange="pcS6NoteDraft.type=this.value" style="width:130px;padding:6px 8px;">'+opts+'</select>'+
      '<textarea class="notes-area" id="s6-note-body" maxlength="'+S6_MAX_NOTE+'" oninput="pcS6NoteDraft.body=this.value" placeholder="What stood out, availability, anything to follow up..." style="flex:1;min-width:220px;min-height:70px;">'+esc(pcS6NoteDraft.body)+'</textarea>'+
    '</div>'+
    '<button class="btn btn-sm btn-primary" style="margin-top:6px;" onclick="pcS6AddNote()"'+dis+'>Add note</button>'+
    pcS6MsgHtml('note');
  var notes=d.notes||[];
  if(notes.length===0){
    html+='<div style="font-size:12px;color:#aaa;margin-top:8px;">No notes yet.</div>';
  } else {
    html+='<div style="margin-top:10px;">';
    notes.forEach(function(n){
      var label='General';
      S6_NOTE_TYPES.forEach(function(t){if(t[0]===n.note_type)label=t[1];});
      html+='<div style="padding:8px 0;border-top:1px solid #f0f0f0;">'+
        '<div style="font-size:12px;color:#888;display:flex;justify-content:space-between;gap:8px;">'+
          '<span><strong style="color:#555;">'+esc(label)+'</strong> &middot; '+esc(ivStamp(n.created_at))+' &middot; '+esc(n.created_by)+'</span>'+
          '<a href="#" style="color:#c0392b;" onclick="pcS6RemoveNote(\''+n.id+'\');return false;">Remove</a>'+
        '</div>'+
        '<div style="font-size:13px;color:#333;line-height:1.55;white-space:pre-wrap;margin-top:3px;">'+esc(n.body)+'</div>'+
      '</div>';
    });
    html+='</div>';
  }
  return html;
}

function renderS6Refs(c,d){
  var dis=pcS6Busy?' disabled':'';
  var html='<div class="detail-label" style="margin:18px 0 6px;">References</div>';
  if(pcS6IsPreHire(c)){
    var cur=c.ref_status||'';
    var btn=function(val,label){
      var on=cur===val;
      return'<button class="btn btn-sm'+(on?' btn-primary':'')+'" onclick="pcS6SetRefStatus('+(val?'\''+val+'\'':'null')+')"'+dis+'>'+label+'</button>';
    };
    html+='<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px;">'+
      '<span style="font-size:12px;color:#888;">Status:</span>'+
      btn('waiting_info','Waiting for ref info')+btn('checking','Checking ref')+(cur?btn('','Clear'):'')+
      '</div>';
    if(cur&&c.ref_status_updated_at)html+='<div style="font-size:11px;color:#aaa;margin-bottom:6px;">Set '+esc(ivStamp(c.ref_status_updated_at))+(c.ref_status_updated_by?' by '+esc(c.ref_status_updated_by):'')+'</div>';
    html+=pcS6MsgHtml('status');
  }
  var refs=d.refs||[];
  if(refs.length===0&&pcS6RefForm!=='new')html+='<div style="font-size:12px;color:#aaa;">No references yet.</div>';
  refs.forEach(function(rf){
    if(pcS6RefForm===rf.id){html+=renderS6RefForm();return;}
    html+='<div style="padding:8px 10px;border:1px solid #eee;border-radius:6px;margin-top:6px;">'+
      '<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;">'+
        '<div style="font-size:13px;"><strong>'+esc(rf.name)+'</strong>'+(rf.relationship?' <span style="color:#888;">&middot; '+esc(rf.relationship)+'</span>':'')+
          (rf.phone?' &middot; <a href="tel:'+esc(rf.phone)+'" style="color:#2d7dd2;">'+esc(formatPhoneDisplay(rf.phone))+'</a>':'')+'</div>'+
        '<div style="font-size:12px;display:flex;gap:10px;">'+
          '<a href="#" onclick="pcS6EditRef(\''+rf.id+'\');return false;">Edit</a>'+
          '<a href="#" style="color:#c0392b;" onclick="pcS6RemoveRef(\''+rf.id+'\');return false;">Remove</a>'+
        '</div>'+
      '</div>'+
      (rf.notes?'<div style="font-size:12px;color:#555;white-space:pre-wrap;margin-top:4px;">'+esc(rf.notes)+'</div>':'')+
      '<div style="margin-top:6px;font-size:12px;">'+
        (rf.checked_at
          ?'<span style="color:#1D9E75;font-weight:600;">&#10003; Checked '+esc(ivStamp(rf.checked_at))+(rf.checked_by?' by '+esc(rf.checked_by):'')+'</span> <a href="#" style="color:#888;margin-left:6px;" onclick="pcS6CheckRef(\''+rf.id+'\',false);return false;">undo</a>'
          :'<button class="btn btn-sm btn-green" onclick="pcS6CheckRef(\''+rf.id+'\',true)"'+dis+'>Mark checked</button>')+
      '</div>'+
    '</div>';
  });
  if(pcS6RefForm==='new')html+=renderS6RefForm();
  else if(pcS6RefForm===null)html+='<button class="btn btn-sm" style="margin-top:8px;" onclick="pcS6NewRef()"'+dis+'>Add reference</button>';
  html+=pcS6MsgHtml('ref');
  return html;
}

function renderS6RefForm(){
  var d=pcS6RefDraft,dis=pcS6Busy?' disabled':'';
  var inp=function(id,key,ph,max,type){
    return'<input type="'+(type||'text')+'" id="'+id+'" maxlength="'+max+'" value="'+esc(d[key])+'" placeholder="'+ph+'" oninput="pcS6RefDraft.'+key+'=this.value" style="margin-bottom:6px;" />';
  };
  return'<div style="padding:10px;border:1px solid #b3d4f7;background:#f7fbff;border-radius:6px;margin-top:6px;">'+
    '<div style="font-size:12px;font-weight:600;color:#185fa5;margin-bottom:6px;">'+(pcS6RefForm==='new'?'New reference':'Edit reference')+'</div>'+
    inp('s6-ref-name','name','Name (required)',120)+
    inp('s6-ref-rel','relationship','Relationship / from where (e.g. former manager at ...)',120)+
    inp('s6-ref-phone','phone','Phone',40,'tel')+
    '<textarea class="notes-area" id="s6-ref-notes" maxlength="2000" oninput="pcS6RefDraft.notes=this.value" placeholder="Notes from the call" style="min-height:50px;">'+esc(d.notes)+'</textarea>'+
    '<div style="display:flex;gap:8px;margin-top:6px;">'+
      '<button class="btn btn-sm btn-primary" onclick="pcS6SaveRef()"'+dis+'>Save reference</button>'+
      '<button class="btn btn-sm" onclick="pcS6CancelRef()">Cancel</button>'+
    '</div>'+
  '</div>';
}

function renderS6Interest(c,d){
  var pairs=pcS6InterestPairs(d.ints);
  var live={};pairs.forEach(function(p){if(p.code&&p.role)live[p.code+'||'+p.role]=p;});
  var html='<div class="detail-label" style="margin:18px 0 6px;">Interested in</div>';
  var summary=pairs.map(function(p){return (p.code?(VENUE_LABELS[p.code]||p.code):'Unknown venue')+' '+(p.role||'unknown role');});
  if(!pcS6IsPreHire(c)){
    html+=summary.length?'<div class="tag-list">'+summary.map(function(s){return'<span class="tag">'+esc(s)+'</span>';}).join('')+'</div>'
      :'<div style="font-size:12px;color:#aaa;">No interest recorded at interview.</div>';
    return html;
  }
  var hints=[];
  if(c.roles&&c.roles.length)hints.push('applied for '+c.roles.join(', '));
  if(c.locations&&c.locations.length)hints.push('locations '+c.locations.join(', '));
  html+='<div style="font-size:12px;color:#888;margin-bottom:8px;">What the candidate wants, from the interview. This is not an assignment; the hire modal pre-checks from it.'+
    (hints.length?'<br>On the application: '+esc(hints.join('; '))+'.':'')+'</div>';
  if(c.is_minor)html+='<div style="font-size:12px;color:#92400e;margin-bottom:8px;">Minor: Bartender and Bar Lead cannot be selected.</div>';
  var counts={};Object.keys(live).forEach(function(k){var v=k.split('||')[0];counts[v]=(counts[v]||0)+1;});
  var sel=pcS6IntVenue||VENUE_CODES[0];
  var venues='';
  VENUE_CODES.forEach(function(code){
    var n=counts[code]||0;
    venues+='<button type="button" class="evr-venue-row'+(sel===code?' sel':'')+'" onclick="pcS6IntSelectVenue(\''+code+'\')">'+
      '<span class="evr-venue-label">'+esc(VENUE_LABELS[code]||code)+'</span>'+
      (n>0?'<span class="evr-venue-badge">'+n+'</span>':'<span class="evr-venue-badge zero">&mdash;</span>')+'</button>';
  });
  var legal=[];try{legal=pcRoles.getRolesForVenue(sel)||[];}catch(e){legal=[];}
  var right;
  if(legal.length===0){
    right='<div class="evr-rolepane-empty">No roles are configured for '+esc(VENUE_LABELS[sel]||sel)+'.</div>';
  } else {
    right='<div class="evr-rolepane-head">Roles at '+esc(VENUE_LABELS[sel]||sel)+'</div><div class="evr-role-pills">'+
      legal.map(function(vr,i){
        var on=!!live[sel+'||'+vr.role_name];
        var blocked=!!c.is_minor&&ALCOHOL_ROLES.indexOf(vr.role_name)!==-1&&!on;
        var disabled=blocked||pcS6Busy;
        return'<button type="button" class="evr-role-pill'+(on?' on':'')+(blocked?' disabled-role':'')+'"'+
          (disabled?' disabled':' onclick="pcS6ToggleInterest(\''+sel+'\','+i+')"')+'>'+
          '<span class="evr-role-check">'+(on?'&#10003;':'+')+'</span>'+esc(vr.role_name)+(blocked?' <span class="evr-rate">(minor)</span>':'')+'</button>';
      }).join('')+'</div>';
  }
  html+='<div class="evr-editor"><div class="evr-venue-col">'+venues+'</div><div class="evr-role-pane">'+right+'</div></div>';
  // Interest that no longer maps to the picker (retired role, unknown venue) still shows and can be removed.
  var orphans=pairs.filter(function(p){
    if(!p.code||!p.role)return true;
    if(VENUE_CODES.indexOf(p.code)===-1)return true;
    var vr=null;try{vr=pcRoles.getVenueRole(p.code,p.role);}catch(e){vr=null;}
    return !vr||!vr.is_active;
  });
  if(summary.length)html+='<div style="background:#eaf3de;border:1px solid #7dc98a;border-radius:6px;padding:8px 12px;margin-top:10px;font-size:12px;color:#27500a;">'+summary.length+' interest'+(summary.length===1?'':'s')+' &middot; '+esc(summary.join(', '))+'</div>';
  orphans.forEach(function(p){
    html+='<div style="font-size:12px;color:#92400e;margin-top:6px;">'+esc((p.code?(VENUE_LABELS[p.code]||p.code):'Unknown venue')+' '+(p.role||'unknown role'))+' is no longer offered, so it will not pre-check. <a href="#" onclick="pcS6RemoveInterest(\''+p.id+'\');return false;">Remove</a></div>';
  });
  html+=pcS6MsgHtml('int');
  return html;
}

// ---- writes ----------------------------------------------------------
function pcS6Run(where,work){
  if(pcS6Busy)return;
  var c=pcSelected;if(!c)return;
  pcS6Busy=true;pcS6Msg=null;render();
  Promise.resolve().then(work).then(function(){
    pcS6Busy=false;
    return pcS6Load(c.id);
  }).then(function(){render();}).catch(function(err){
    console.error('Session 6 write failed ('+where+'):',err);
    pcS6Busy=false;
    pcS6Msg={where:where,text:pcS6ErrText(err)};
    pcS6Load(c.id);
    render();
  });
}
function pcS6ErrText(err){
  var body=(err&&err.body)?String(err.body):'';
  if(body.indexOf('minor_alcohol_role')>-1)return'Minors cannot be marked interested in Bartender or Bar Lead.';
  if(body.indexOf('candidate_interests_one_live_pair')>-1)return'That interest is already recorded (someone may have added it just now).';
  if(body.indexOf('candidate_interests_venue_role_fkey')>-1)return'That role is not offered at that venue.';
  return'Save failed: '+ivErrMsg(err);
}
function pcS6Stamp(){return{deleted_at:new Date().toISOString(),deleted_by:pcS6Actor()};}

function pcS6AddNote(){
  var c=pcSelected;if(!c)return;
  var tEl=document.getElementById('s6-note-type'),bEl=document.getElementById('s6-note-body');
  var type=tEl?tEl.value:'general';
  var body=(bEl?bEl.value:'').trim();
  if(!body){pcS6Msg={where:'note',text:'Type a note first.'};render();return;}
  if(body.length>S6_MAX_NOTE){pcS6Msg={where:'note',text:'Notes are limited to '+S6_MAX_NOTE+' characters.'};render();return;}
  pcS6Run('note',function(){
    return sbFetch('/rest/v1/candidate_notes',{method:'POST',prefer:'return=minimal',body:{candidate_id:c.id,note_type:type,body:body,created_by:pcS6Actor()}})
      .then(function(){pcS6NoteDraft={type:type,body:''};});
  });
}
function pcS6RemoveNote(id){
  if(!confirm('Remove this note? It will be hidden from the card.'))return;
  pcS6Run('note',function(){
    return sbFetch('/rest/v1/candidate_notes?id=eq.'+id+'&deleted_at=is.null',{method:'PATCH',prefer:'return=minimal',body:pcS6Stamp()});
  });
}

function pcS6SetRefStatus(val){
  var c=pcSelected;if(!c)return;
  var now=new Date().toISOString(),by=pcS6Actor();
  pcS6Run('status',function(){
    return sbFetch('/rest/v1/candidates?id=eq.'+c.id,{method:'PATCH',prefer:'return=minimal',body:{ref_status:val,ref_status_updated_at:now,ref_status_updated_by:by,updated_at:now}})
      .then(function(){c.ref_status=val;c.ref_status_updated_at=now;c.ref_status_updated_by=by;});
  });
}

function pcS6NewRef(){pcS6RefForm='new';pcS6RefDraft={name:'',relationship:'',phone:'',notes:''};pcS6Msg=null;render();}
function pcS6EditRef(id){
  var e=pcS6[pcSelected?pcSelected.id:''];if(!e||!e.data)return;
  var rf=null;e.data.refs.forEach(function(r){if(r.id===id)rf=r;});
  if(!rf)return;
  pcS6RefForm=id;
  pcS6RefDraft={name:rf.name||'',relationship:rf.relationship||'',phone:rf.phone||'',notes:rf.notes||''};
  pcS6Msg=null;render();
}
function pcS6CancelRef(){pcS6RefForm=null;pcS6Msg=null;render();}
function pcS6SaveRef(){
  var c=pcSelected;if(!c||pcS6RefForm===null)return;
  var d={
    name:(pcS6RefDraft.name||'').trim().slice(0,120),
    relationship:(pcS6RefDraft.relationship||'').trim().slice(0,120),
    phone:(pcS6RefDraft.phone||'').trim().slice(0,40),
    notes:(pcS6RefDraft.notes||'').trim().slice(0,2000)
  };
  if(!d.name){pcS6Msg={where:'ref',text:'A reference needs a name.'};render();return;}
  var editing=pcS6RefForm;
  var body={name:d.name,relationship:d.relationship||null,phone:d.phone||null,notes:d.notes||null};
  pcS6Run('ref',function(){
    var req;
    if(editing==='new'){
      body.candidate_id=c.id;body.created_by=pcS6Actor();
      req=sbFetch('/rest/v1/candidate_references',{method:'POST',prefer:'return=minimal',body:body});
    } else {
      body.updated_at=new Date().toISOString();
      req=sbFetch('/rest/v1/candidate_references?id=eq.'+editing+'&deleted_at=is.null',{method:'PATCH',prefer:'return=minimal',body:body});
    }
    return req.then(function(){pcS6RefForm=null;pcS6RefDraft={name:'',relationship:'',phone:'',notes:''};});
  });
}
function pcS6CheckRef(id,checked){
  var c=pcSelected;if(!c)return;
  var now=new Date().toISOString(),by=pcS6Actor();
  pcS6Run('ref',function(){
    var body=checked?{checked_at:now,checked_by:by,updated_at:now}:{checked_at:null,checked_by:null,updated_at:now};
    return sbFetch('/rest/v1/candidate_references?id=eq.'+id+'&deleted_at=is.null',{method:'PATCH',prefer:'return=minimal',body:body})
      .then(function(){
        // A checked reference ends the waiting/checking substate.
        if(!checked||!c.ref_status)return;
        return sbFetch('/rest/v1/candidates?id=eq.'+c.id,{method:'PATCH',prefer:'return=minimal',body:{ref_status:null,ref_status_updated_at:now,ref_status_updated_by:by,updated_at:now}})

// ---- hire modal pre-check ----------------------------------------------
// Fills pcHireState.pairs from interview interest, through the same legality
// rules the hire modal enforces. Never rejects: on any problem the modal
// opens with nothing pre-checked and says why.
function pcS6PrefillHire(){
  var c=pcSelected,st=pcHireState;
  if(!c||!st)return Promise.resolve();
  var e=pcS6[c.id];
  var p=(e&&e.status==='ok')?Promise.resolve(e):pcS6Load(c.id);
  return p.then(function(entry){
    if(pcHireState!==st)return;
    if(!entry||entry.status!=='ok'){
      st.prefillHtml='<div style="background:#fdecea;border:1px solid #f4b8b8;border-radius:6px;padding:8px 12px;margin-bottom:12px;font-size:12px;color:#8b1a1a;">Interview interest could not be loaded, so nothing is pre-checked.'+(entry&&entry.err?' ('+esc(entry.err)+')':'')+'</div>';
      return;
    }
    var used=[],skipped=[];
    pcS6InterestPairs(entry.data.ints).forEach(function(pr){
      var label=(pr.code?(VENUE_LABELS[pr.code]||pr.code):'Unknown venue')+' '+(pr.role||'unknown role');
      if(!pr.code||!pr.role||VENUE_CODES.indexOf(pr.code)===-1){skipped.push(label+' (not in the venue list)');return;}
      var vr=null;try{vr=pcRoles.getVenueRole(pr.code,pr.role);}catch(x){vr=null;}
      if(!vr||!vr.is_active){skipped.push(label+' (no longer offered)');return;}
      if(c.is_minor&&ALCOHOL_ROLES.indexOf(pr.role)!==-1){skipped.push(label+' (minor)');return;}
      st.pairs[pr.code+'||'+pr.role]=true;
      if(used.length===0)st.selectedVenue=pr.code;
      used.push(label);
    });
    var h='';
    if(used.length)h+='<div style="background:#e6f1fb;border:1px solid #b3d4f7;border-radius:6px;padding:8px 12px;margin-bottom:12px;font-size:12px;color:#185fa5;">Pre-checked '+used.length+' role'+(used.length===1?'':'s')+' from interview interest. Untick anything that does not apply.</div>';
    if(skipped.length)h+='<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:8px 12px;margin-bottom:12px;font-size:12px;color:#92400e;">Not pre-checked: '+esc(skipped.join(', '))+'.</div>';
    st.prefillHtml=h;
  }).catch(function(err){
    console.error('Hire pre-check failed:',err);
    if(pcHireState===st)st.prefillHtml='<div style="background:#fdecea;border:1px solid #f4b8b8;border-radius:6px;padding:8px 12px;margin-bottom:12px;font-size:12px;color:#8b1a1a;">Interview interest could not be applied, so nothing is pre-checked.</div>';
  });
}

var IV_FN_URL=SUPABASE_URL+'/functions/v1/interview-staff';
var IV_TZ='America/New_York';
var IV_DAY=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var IV_MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var IV_LINK_STAGES=['applied','contacted','interview_requested'];
var IV_PRE_HIRE=['applied','contacted','interview_requested','interview_scheduled'];

function staffAction(body){
  return fetch(IV_FN_URL,{method:'POST',headers:apiHeadersJson(),body:JSON.stringify(body)}).then(function(r){
    return r.text().then(function(t){
      var d=null;try{d=t?JSON.parse(t):null;}catch(e){d=null;}
      if(!r.ok||!d||d.ok!==true){
        var err=new Error((d&&d.message)?d.message:('HTTP '+r.status+' from interview-staff'));
        err.status=r.status;err.code=d?d.code:null;throw err;
      }
      return d;
    });
  });
}
function ivErrMsg(err){return (err&&err.message)?err.message:'Something went wrong. Please try again.';}

// slot_date + start_time are Eastern wall-clock values
function ivWallLabel(d,t){
  var p=String(d||'').split('-'),tm=String(t||'').split(':');
  if(p.length!==3||tm.length<2)return'--';
  var dt=new Date(Date.UTC(parseInt(p[0],10),parseInt(p[1],10)-1,parseInt(p[2],10),12));
  var h=parseInt(tm[0],10),h12=h%12===0?12:h%12;
  return IV_DAY[dt.getUTCDay()]+', '+IV_MON[dt.getUTCMonth()]+' '+dt.getUTCDate()+' at '+h12+':'+tm[1]+' '+(h>=12?'PM':'AM');
}
function ivStamp(iso){
  if(!iso)return'--';
  return new Date(iso).toLocaleString('en-US',{timeZone:IV_TZ,month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
}
function ivNowKey(){return new Date().toLocaleString('sv-SE',{timeZone:IV_TZ}).slice(0,16);}
function ivSlotKey(d,t){return String(d)+' '+String(t).slice(0,5);}
function ivSlotBooked(slotId){
  for(var i=0;i<pcBookings.length;i++){if(pcBookings[i].slot_id===slotId&&pcBookings[i].status!=='cancelled')return true;}
  return false;
}
function ivOpenRequest(cid){
  for(var i=0;i<pcRequests.length;i++){if(pcRequests[i].candidate_id===cid)return pcRequests[i];}
  return null;
}
function ivPrefs(rid){
  var out=[];
  for(var i=0;i<pcPrefs.length;i++){if(pcPrefs[i].request_id===rid)out.push(pcPrefs[i]);}
  out.sort(function(a,b){return a.rank-b.rank;});
  return out;
}
function ivLinks(cid){
  var out=[];
  for(var i=0;i<pcLinks.length;i++){if(pcLinks[i].candidate_id===cid)out.push(pcLinks[i]);}
  return out;
}
function ivBookableSlots(excludeIds){
  var now=ivNowKey(),out=[];
  for(var i=0;i<pcOpenSlots.length;i++){
    var s=pcOpenSlots[i];
    if(excludeIds.indexOf(s.id)>-1)continue;
    if(ivSlotKey(s.slot_date,s.start_time)<=now)continue;
    if(ivSlotBooked(s.id))continue;
    out.push(s);
  }
  return out;
}
function ivLinkStatus(l){
  if(l.retired_at){
    if(l.retired_reason==='superseded')return'Replaced by a newer link';
    if(l.retired_reason==='declined')return'Closed (request declined)';
    return'Closed';
  }
  if(new Date(l.expires_at).getTime()<Date.now())return'Expired '+ivStamp(l.expires_at);
  return'Active until '+ivStamp(l.expires_at);
}

function renderInterviewSection(c){

      '</div><div style="display:flex;gap:8px;flex-wrap:wrap;">'+
      '<button class="btn btn-sm" id="iv-resched-btn" onclick="pcIvReschedule(\''+booking.id+'\')">Reschedule (send new link)</button>'+
      '<button class="btn btn-sm btn-danger" onclick="pcIvShowCancel(\''+booking.id+'\')">Cancel interview</button></div>'+
      renderChangeTime(booking);
  } else if(req){
    html+=renderRequestPanel(req,c);
  } else if(stage==='interview_scheduled'){
    html+='<div class="email-sent-banner">Stage says Interview Scheduled, but no interview is booked. Move the stage back, then send an interview link.</div>';
  } else if(links.length>0&&!links[0].retired_at&&new Date(links[0].expires_at).getTime()>Date.now()){
    html+='<div class="email-sent-banner">Waiting for the candidate to pick interview times.</div>';
  }

  if(links.length>0){
    html+='<div style="margin-top:12px;"><div class="detail-label" style="margin-bottom:4px;">Interview link history</div>';

      var l=links[i];
      var mail=l.email_sent_at?'emailed':(l.email_error?'<span style="color:#c0392b;">email failed</span>':'email pending');
      var opened=l.open_count>0?'opened '+l.open_count+'x (last '+esc(ivStamp(l.last_opened_at))+')':'not opened';
      html+='<div style="font-size:12px;color:#555;padding:5px 0;border-top:1px solid #f0f0f0;line-height:1.5;">'+
        '<strong>'+esc(ivStamp(l.created_at))+'</strong>'+(l.created_by?' by '+esc(l.created_by):'')+' &middot; '+mail+
        ' &middot; '+opened+(l.used_at?' &middot; times sent '+esc(ivStamp(l.used_at)):'')+
        '<br><span style="color:#888;">'+esc(ivLinkStatus(l))+'</span></div>';
    }
    html+='</div>';
  }
  html+='</div>';

function renderRequestPanel(req,c){
  var html='<div style="background:#f0f6ff;border:1px solid #b3d4f7;border-radius:8px;padding:12px 14px;">';
  html+='<div style="font-size:11px;color:#0c447c;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;">Interview request &middot; '+esc(ivStamp(req.created_at))+'</div>';

      var taken=ivSlotBooked(p.slot_id);

    html+='<div style="font-size:13px;color:#333;margin-bottom:6px;"><strong>No times were open</strong> when they opened their link. Add times on the Interviews page, then use Ask for new times.</div>';

  } else {
    html+='<div style="display:flex;gap:6px;flex-wrap:wrap;"><select id="iv-other-slot" style="flex:1;min-width:180px;margin-bottom:0;"><option value="">-- Choose a time --</option>';

  html+='</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">'+
    '<button class="btn btn-sm" onclick="pcIvShowResolve(\''+req.id+'\',\'new_times\')">Ask for new times</button>'+
    '<button class="btn btn-sm btn-danger" onclick="pcIvShowResolve(\''+req.id+'\',\'declined\')">Decline</button></div>';
  html+='</div>';
  return html;
}

  staffAction({action:'confirm',request_id:requestId,slot_id:slotId}).then(function(d){
    if(!d.email_sent)alert('The interview is booked for '+(d.when||label)+', but the confirmation email did not send: '+(d.email_error||'unknown error')+'\n\nContact the candidate directly.');

  }).catch(function(err){console.error('Confirm interview failed:',err);alert('Not booked. '+ivErrMsg(err));loadAll();});

  staffAction({action:kind==='new_times'?'new_times':'decline',request_id:requestId,note:note||null}).then(function(d){
    pcPipeCloseModal(null);
    if(kind==='new_times'&&!d.email_sent)alert('The request was closed and a new link was created, but the email did not send: '+(d.email_error||'unknown error')+'\n\nUse Resend on the interview link button.');
    loadAll();
  }).catch(function(err){console.error('Resolve request failed:',err);ivModalFail(err,label);});
}

function pcIvShowCancel(bookingId){
  var html='<div class="modal-overlay" onclick="pcPipeCloseModal(event)"><div class="modal-box"><h3>Cancel interview</h3>'+
    '<p>Cancels the interview and frees the time. The candidate moves back to Contacted.</p>'+
    '<label style="font-size:13px;color:#555;display:block;margin-bottom:4px;">Reason (optional, internal)</label>'+
    '<input type="text" id="iv-cancel-reason" maxlength="500" style="margin-bottom:10px;" />'+
    '<label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#333;margin-bottom:12px;cursor:pointer;"><input type="checkbox" id="iv-cancel-notify" checked style="width:auto;" /> Email the candidate that it is cancelled (removes it from their calendar)</label>'+
    '<div id="iv-modal-err" class="error-msg" style="margin-bottom:8px;"></div>'+
    '<div style="display:flex;gap:8px;"><button class="btn" style="flex:1;" onclick="pcPipeCloseModal(null)">Keep interview</button>'+
    '<button class="btn btn-danger" style="flex:1;" id="iv-modal-btn" onclick="pcIvCancel(\''+bookingId+'\')">Cancel interview</button></div></div></div>';
  document.getElementById('pcpipe-modal').innerHTML=html;
}

function pcIvCancel(bookingId){
  var r=document.getElementById('iv-cancel-reason'),n=document.getElementById('iv-cancel-notify');
  var reason=r?r.value.trim():'';
  var notify=n?n.checked:true;
  ivModalBusy('Cancelling...');
  staffAction({action:'cancel',booking_id:bookingId,reason:reason||null,notify:notify,stage_to:'contacted'}).then(function(d){
    pcPipeCloseModal(null);
    if(notify&&!d.email_sent)alert('The interview is cancelled, but the email to the candidate did not send: '+(d.email_error||'unknown error'));
    loadAll();
  }).catch(function(err){console.error('Cancel interview failed:',err);ivModalFail(err,'Cancel interview');});
}

function pcIvReschedule(bookingId){
  if(!confirm('Reschedule '+ivCandidateName()+'?\n\nThis cancels the current interview (freeing the time) and emails them a new link to pick again, with a calendar update removing the old time.'))return;
  var btn=document.getElementById('iv-resched-btn');if(btn){btn.disabled=true;btn.textContent='Sending...';}
  staffAction({action:'cancel',booking_id:bookingId,reason:'Rescheduled from the Pipeline',reschedule:true,stage_to:'contacted'}).then(function(d){
    if(!d.email_sent)alert('The interview was cancelled and a new link was created, but the email did not send: '+(d.email_error||'unknown error')+'\n\nUse Resend on the interview link button.');
    loadAll();
  }).catch(function(err){console.error('Reschedule failed:',err);alert('Not rescheduled. '+ivErrMsg(err));loadAll();});
}


// Their earlier picks for the booked request (excluding the current time), then all other open times.
function ivSlotOptions(currentSlotId,requestId){
  var now=ivNowKey(),seen=[currentSlotId],html='',theirs='';
  if(requestId){
    var ps=[];
    for(var i=0;i<pcPrefs.length;i++){if(pcPrefs[i].request_id===requestId)ps.push(pcPrefs[i]);}
    ps.sort(function(a,b){return a.rank-b.rank;});
    for(var k=0;k<ps.length;k++){
      var p=ps[k],s=p.interview_slots;
      if(!s||seen.indexOf(p.slot_id)>-1)continue;
      seen.push(p.slot_id);
      if(ivSlotKey(s.slot_date,s.start_time)<=now||ivSlotBooked(p.slot_id))continue;
      theirs+='<option value="'+p.slot_id+'">Their #'+p.rank+': '+esc(ivWallLabel(s.slot_date,s.start_time))+'</option>';
    }
  }
  if(theirs)html+='<optgroup label="Times they picked">'+theirs+'</optgroup>';
  var other=ivBookableSlots(seen),rest='';
  for(var j=0;j<other.length&&j<120;j++)rest+='<option value="'+other[j].id+'">'+esc(ivWallLabel(other[j].slot_date,other[j].start_time))+'</option>';
  if(rest)html+='<optgroup label="Other open times">'+rest+'</optgroup>';
  return html;
}
function renderChangeTime(booking){
  var opts=ivSlotOptions(booking.slot_id,booking.request_id);
  var html='<div style="margin-top:12px;"><div class="detail-label" style="margin-bottom:4px;">Change time (keeps the interview, emails the new time)</div>';
  if(!opts)return html+'<div style="font-size:12px;color:#888;">No other open times. Add times on the Interviews page.</div></div>';
  return html+'<div style="display:flex;gap:6px;flex-wrap:wrap;"><select id="iv-move-slot" style="flex:1;min-width:180px;margin-bottom:0;"><option value="">-- Choose the new time --</option>'+opts+'</select>'+
    '<button class="btn btn-sm btn-primary" id="iv-move-btn" onclick="pcIvMove(\''+booking.id+'\')">Move interview</button></div></div>';
}
function renderBookTime(){
  var opts=ivSlotOptions(null,null);
  var html='<div style="margin-top:12px;"><div class="detail-label" style="margin-bottom:4px;">Book a time you already agreed with them</div>';
  if(!opts)return html+'<div style="font-size:12px;color:#888;">No open times. Add times on the Interviews page.</div></div>';
  return html+'<div style="display:flex;gap:6px;flex-wrap:wrap;"><select id="iv-book-slot" style="flex:1;min-width:180px;margin-bottom:0;"><option value="">-- Choose a time --</option>'+opts+'</select>'+
    '<button class="btn btn-sm btn-green" id="iv-book-btn" onclick="pcIvBook()">Book interview</button></div></div>';
}
function ivSelectedLabel(sel){return sel&&sel.selectedIndex>-1?sel.options[sel.selectedIndex].text.replace(/^Their #\d+: /,''):'';}
function pcIvMove(bookingId){
  var sel=document.getElementById('iv-move-slot');
  if(!sel||!sel.value){alert('Choose the new time first.');return;}
  if(!confirm('Move '+ivCandidateName()+'\'s interview to '+ivSelectedLabel(sel)+' (Eastern)?\n\nThey get an email with the new time, and the calendar invite updates to it.'))return;
  var btn=document.getElementById('iv-move-btn');if(btn){btn.disabled=true;btn.textContent='Moving...';}
  staffAction({action:'move',booking_id:bookingId,slot_id:sel.value}).then(function(d){
    if(!d.email_sent)alert('The interview was moved to '+(d.when||'the new time')+', but the email did not send: '+(d.email_error||'unknown error')+'\n\nContact the candidate directly.');
    loadAll();
  }).catch(function(err){console.error('Move failed:',err);alert('Not moved. '+ivErrMsg(err));loadAll();});
}
function pcIvBook(){
  if(!pcSelected)return;
  var sel=document.getElementById('iv-book-slot');
  if(!sel||!sel.value){alert('Choose a time first.');return;}
  if(!confirm('Book '+ivCandidateName()+' for '+ivSelectedLabel(sel)+' (Eastern)?\n\nThe confirmation email with the Google Meet link goes out right away.'))return;
  var btn=document.getElementById('iv-book-btn');if(btn){btn.disabled=true;btn.textContent='Booking...';}
  staffAction({action:'book',candidate_id:pcSelected.id,slot_id:sel.value}).then(function(d){
    if(!d.email_sent)alert('Booked for '+(d.when||'that time')+', but the confirmation email did not send: '+(d.email_error||'unknown error')+'\n\nContact the candidate directly.');
    loadAll();
  }).catch(function(err){console.error('Book failed:',err);alert('Not booked. '+ivErrMsg(err));loadAll();});
}

// Hire / reject tidy-up: closes open requests, links, and the booking.
function ivCloseInterviews(cid,outcome){
  return staffAction({action:'close',candidate_id:cid,outcome:outcome});
}

function init(){
  loadAll();
}

pcAuth.require({
  pageSlug: 'pipeline',
  onReady: function(user) {
    // Header + user pill painted by pc-nav.js — no manual setup here.
    pcActivity.init('pipeline');
    if(window.pcRoles&&pcRoles.ready)pcRoles.ready().catch(function(){});
    init();
  }
});
