<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P&amp;L Overview — Admin · Popcorn Chez</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap">

<script src="/pc-auth.js"></script>
<script src="/pc-nav.js"></script>
<script src="/pc-activity.js"></script>

<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #faf9f6; color: #1a1a1a;
    font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page-title-row {
    background: #faf9f6; border-bottom: 1px solid #e8e8e4;
    padding: 18px 22px 16px;
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
  }
  .page-title { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  .page-title-meta { font-size: 12px; color: #888; font-weight: 500; }
  .page-title-meta { display: flex; align-items: center; gap: 10px; }
  .hdr-basis { color: #888; }
  .hdr-btn {
    display: inline-block; background: #1a1a1a; color: #fff; text-decoration: none;
    font-size: 12.5px; font-weight: 500; padding: 7px 14px; border-radius: 6px;
  }
  .hdr-btn:hover { background: #2c2c2a; }
  button.hdr-btn { font-family: inherit; border: 0; cursor: pointer; line-height: 1.5; }
  /* Proof, not data entry — outlined so it doesn't compete with the two
     buttons that change what the statement says. */
  .hdr-btn.is-quiet {
    background: transparent; color: #555; border: 1px solid #d8d6cc;
  }
  .hdr-btn.is-quiet:hover { background: #f1f0eb; color: #1a1a1a; border-color: #b4b2a9; }
  

  .page-body { max-width: 1040px; margin: 0 auto; padding: 18px 22px 80px; }

  /* ── Date chips ── */
  .chip-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .chip {
    background: #fff; border: 1px solid #e0dfd8; color: #555;
    font-family: inherit; font-size: 13px; font-weight: 500;
    padding: 7px 14px; border-radius: 20px; cursor: pointer;
    transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
  }
  .chip:hover { background: #f1f0eb; color: #1a1a1a; }
  .chip.is-active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .chip-range { display: inline-flex; align-items: center; gap: 6px; margin-left: 4px; }
  .chip-range[hidden] { display: none; }
  .chip-range input[type="date"] {
    font-family: inherit; font-size: 13px; padding: 6px 8px;
    border: 1px solid #e0dfd8; border-radius: 6px; background: #fff; color: #1a1a1a;
  }
  .chip-range input:focus { outline: none; border-color: #1a1a1a; }
  .chip-range span { color: #888; font-size: 12px; }

  .range-banner { font-size: 12px; color: #888; margin-bottom: 16px; }
  .range-banner strong { color: #555; font-weight: 600; }

  /* ── Warning strip ── */
  .warn-strip {
    background: #fef6ec; border: 1px solid #f3d9a8; border-radius: 8px;
    padding: 11px 14px; margin-bottom: 16px; font-size: 12.5px;
    color: #633806; line-height: 1.5;
  }
  .warn-strip[hidden] { display: none; }
  .warn-strip strong { font-weight: 600; }
  .warn-strip ul { margin: 6px 0 0; padding-left: 18px; }
  .warn-strip li { margin-bottom: 2px; }

  /* ── Statement ── */
  .stmt-card {
    background: #fff; border: 0.5px solid #e0dfd8; border-radius: 12px;
    overflow: hidden; margin-bottom: 18px;
  }
  .stmt-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .stmt-table td { padding: 9px 18px; vertical-align: middle; }
  .stmt-table td.col-amt {
    text-align: right; font-variant-numeric: tabular-nums;
    white-space: nowrap; width: 150px;
  }
  .stmt-table td.col-pct {
    text-align: right; font-variant-numeric: tabular-nums;
    white-space: nowrap; width: 70px; color: #888; font-size: 12px;
  }

  tr.sec-head td {
    background: #f6f6f3; border-top: 1px solid #e0dfd8; border-bottom: 1px solid #e0dfd8;
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.07em;
    text-transform: uppercase; color: #666; padding: 9px 18px;
  }
  tr.line-row { border-bottom: 1px solid #f6f5f0; cursor: pointer; }
  tr.line-row:hover { background: #fafaf6; }
  tr.line-row.is-open { background: #f6f6f3; }
  tr.line-row td.col-label { padding-left: 30px; }
  tr.line-row .chev {
    display: inline-block; width: 9px; margin-right: 7px;
    color: #b4b2a9; font-size: 9px; transition: transform 0.12s ease;
  }
  tr.line-row.is-open .chev { transform: rotate(90deg); }

  tr.subtotal-row td {
    border-top: 1px solid #d8d6ce; font-weight: 600; padding-top: 11px; padding-bottom: 11px;
  }
  tr.net-row td {
    border-top: 2px solid #1a1a1a; border-bottom: 2px solid #1a1a1a;
    font-weight: 700; font-size: 15px; padding-top: 14px; padding-bottom: 14px;
    background: #f1f0eb;
  }
  tr.spacer-row td { padding: 0; height: 10px; border: 0; }

  .is-negative { color: #791F1F; }
  .is-muted    { color: #b4b2a9; }

  /* ── Drill-down ── */
  tr.detail-row td { padding: 0; background: #fafaf6; border-bottom: 1px solid #f0efe8; }
  .detail-wrap { padding: 4px 18px 12px 30px; }
  .detail-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .detail-table th {
    text-align: left; padding: 7px 10px; font-weight: 500; color: #888;
    font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase;
    border-bottom: 1px solid #e8e6de; white-space: nowrap;
  }
  .detail-table th.is-amt { text-align: right; }
  .detail-table td { padding: 7px 10px; border-bottom: 1px solid #f0efe8; vertical-align: top; }
  .detail-table tr:last-child td { border-bottom: 0; }
  .detail-table td.d-date { font-variant-numeric: tabular-nums; color: #666; white-space: nowrap; width: 88px; }
  .detail-table td.d-venue { color: #888; width: 90px; white-space: nowrap; }
  .detail-table td.d-src { color: #b4b2a9; font-size: 11px; width: 96px; white-space: nowrap; }
  .detail-table td.d-amt {
    text-align: right; font-variant-numeric: tabular-nums;
    font-weight: 500; white-space: nowrap; width: 110px;
  }
  .detail-more { padding: 8px 10px; font-size: 12px; color: #888; font-style: italic; }
  .detail-table td.d-act { text-align: right; white-space: nowrap; width: 140px; }
  .detail-table th.is-act { width: 140px; }
  .mini-btn {
    background: transparent; border: 1px solid #e0dfd8; color: #555;
    font-family: inherit; font-size: 10.5px; font-weight: 500;
    padding: 3px 9px; border-radius: 5px; cursor: pointer; margin-left: 4px;
  }
  .mini-btn:hover { background: #f1f0eb; color: #1a1a1a; border-color: #c8c6bd; }

  /* ── Edit modal ── */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.36); z-index: 1500;
    display: none; align-items: flex-start; justify-content: center;
    padding: 60px 16px; overflow-y: auto;
  }
  .modal-backdrop.is-open { display: flex; }
  .modal-card {
    background: #fff; border-radius: 14px; max-width: 560px; width: 100%;
    box-shadow: 0 10px 40px rgba(0,0,0,0.18); overflow: hidden;
  }
  .modal-head {
    padding: 20px 24px 14px; border-bottom: 1px solid #f0efe8;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  }
  .modal-title { font-size: 17px; font-weight: 600; }
  .modal-subtitle { font-size: 12px; color: #888; margin-top: 3px; line-height: 1.45; }
  .modal-close {
    background: transparent; border: 0; font-size: 22px; color: #888;
    cursor: pointer; line-height: 1; padding: 4px 8px;
  }
  .modal-close:hover { color: #1a1a1a; }
  .modal-body { padding: 20px 24px; }
  .modal-footer {
    padding: 14px 24px; border-top: 1px solid #f0efe8; background: #fafaf6;
    display: flex; justify-content: space-between; gap: 10px; align-items: center;
  }
  .modal-footer .left { display: flex; gap: 8px; }
  .modal-footer .right { display: flex; gap: 10px; margin-left: auto; }

  .m-field { margin-bottom: 14px; }
  .m-field label {
    display: block; font-size: 11px; font-weight: 500; letter-spacing: 0.04em;
    text-transform: uppercase; color: #666; margin-bottom: 5px;
  }
  .m-field select, .m-field input[type="text"] {
    width: 100%; font-family: inherit; font-size: 13px; padding: 8px 10px;
    border: 1px solid #e0dfd8; border-radius: 6px; background: #fff; color: #1a1a1a;
  }
  .m-field select:focus, .m-field input:focus { outline: none; border-color: #1a1a1a; }
  .m-hint { font-size: 11px; color: #888; margin-top: 4px; line-height: 1.45; }

  .txn-summary {
    background: #fafaf6; border: 1px solid #e8e8e4; border-radius: 8px;
    padding: 11px 13px; margin-bottom: 16px; font-size: 12.5px; color: #555;
  }
  .txn-summary .amt {
    font-size: 18px; font-weight: 700; color: #1a1a1a;
    font-variant-numeric: tabular-nums; display: block; margin-top: 3px;
  }

  /* Split lines */
  .split-hdr {
    display: grid; grid-template-columns: 1fr 120px 26px; gap: 8px;
    font-size: 10px; font-weight: 500; letter-spacing: 0.04em;
    text-transform: uppercase; color: #888; padding: 0 2px 6px;
  }
  .split-hdr .h-amt { text-align: right; }
  .split-line {
    display: grid; grid-template-columns: 1fr 120px 26px; gap: 8px;
    align-items: center; margin-bottom: 6px;
  }
  .split-line select, .split-line input {
    font-family: inherit; font-size: 13px; padding: 7px 8px;
    border: 1px solid #e0dfd8; border-radius: 5px; background: #fff; color: #1a1a1a;
  }
  .split-line input {
    text-align: right; font-variant-numeric: tabular-nums; font-weight: 500;
  }
  .split-line input.is-error, .split-line select.is-error {
    border-color: #791F1F; background: #fceaea;
  }
  .split-rm {
    background: transparent; border: 0; color: #aaa; font-size: 16px;
    cursor: pointer; padding: 0; line-height: 1;
  }
  .split-rm:hover { color: #791F1F; }
  .split-add {
    background: transparent; border: 0; color: #555; font-family: inherit;
    font-size: 12px; cursor: pointer; padding: 4px 2px;
  }
  .split-add:hover { color: #1a1a1a; }
  .split-status {
    font-size: 12px; font-weight: 500; padding: 8px 12px;
    border-radius: 6px; text-align: center; margin-top: 10px;
  }
  .split-status.ok    { background: #eaf3de; color: #27500A; border: 1px solid #97C459; }
  .split-status.under { background: #fef6ec; color: #633806; border: 1px solid #f3d9a8; }
  .split-status.over  { background: #fceaea; color: #791F1F; border: 1px solid #f0c0c0; }

  .btn-primary {
    background: #1a1a1a; color: #fff; border: 0; font-family: inherit;
    font-size: 13px; font-weight: 500; padding: 9px 18px; border-radius: 6px; cursor: pointer;
  }
  .btn-primary:hover { background: #2c2c2a; }
  .btn-primary:disabled { background: #b4b2a9; cursor: not-allowed; }
  .btn-secondary {
    background: transparent; border: 1px solid #e0dfd8; color: #555;
    font-family: inherit; font-size: 13px; font-weight: 500;
    padding: 9px 18px; border-radius: 6px; cursor: pointer;
  }
  .btn-secondary:hover { background: #f1f0eb; color: #1a1a1a; }
  .btn-danger-quiet {
    background: transparent; border: 0; color: #791F1F; font-family: inherit;
    font-size: 12px; cursor: pointer; padding: 9px 4px;
    text-decoration: underline; text-underline-offset: 3px;
  }
  .btn-danger-quiet:hover { color: #501313; }
  .split-tag {
    display: inline-block; font-size: 9.5px; font-weight: 600;
    background: #f0e6f8; color: #5B2D7E; padding: 1px 6px;
    border-radius: 3px; margin-left: 6px; vertical-align: middle;
  }

  /* ── Loading / empty ── */
  .stmt-loading, .stmt-empty {
    padding: 60px 20px; text-align: center; color: #888; font-size: 13px;
  }

  .footnote { font-size: 11.5px; color: #999; line-height: 1.6; margin-top: 4px; }
  .footnote strong { color: #666; font-weight: 600; }

  /* ── Toast ── */
  .pc-toast-host {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    z-index: 2000; pointer-events: none;
  }
  .pc-toast {
    background: #1a1a1a; color: #fff; font-size: 13px; font-weight: 500;
    padding: 11px 18px; border-radius: 24px; box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    opacity: 0; transform: translateY(8px);
    transition: opacity 0.18s ease, transform 0.18s ease;
  }
  .pc-toast.is-shown { opacity: 1; transform: translateY(0); }

  .access-denied { max-width: 520px; margin: 60px auto; text-align: center; color: #555; }
  .access-denied h2 { font-size: 18px; color: #1a1a1a; }

  body.pre-auth .page-body, body.pre-auth .page-title-row { display: none; }

  @media (max-width: 700px) {
    .stmt-table td { padding: 8px 12px; }
    .stmt-table td.col-amt { width: 110px; }
    .stmt-table td.col-pct { display: none; }
    .detail-table td.d-venue, .detail-table td.d-src { display: none; }
  }

  /* Statement header — print only. */
  .print-head { display: none; }

  /* ── Print / Save-as-PDF ──
     Prints the statement and nothing else. Drill-down is suppressed by CSS
     rather than collapsed in state, so the printed page is identical no
     matter what the reader had expanded on screen. */
  @media print {
    @page { size: letter portrait; margin: 0.6in 0.65in; }

    html, body { background: #fff !important; font-size: 11pt; }

    #pc-nav-root,
    #pc-nav-totop,
    .page-title-row,
    .chip-row,
    .range-banner,
    .warn-strip,
    .pc-toast-host,
    .modal-backdrop { display: none !important; }

    .page-body { max-width: none; margin: 0; padding: 0; }

    .print-head { display: block; text-align: center; margin: 0 0 20px; }
    .ph-co    { font-size: 15pt; font-weight: 700; letter-spacing: -0.01em; }
    .ph-title { font-size: 13pt; font-weight: 600; margin-top: 2px; }
    .ph-basis { font-size: 10pt; color: #444; margin-top: 3px; }
    .ph-range { font-size: 10pt; color: #444; margin-top: 1px; }

    .stmt-card {
      border: 0; border-radius: 0; overflow: visible;
      background: transparent; margin-bottom: 12px;
    }
    .stmt-table { font-size: 10pt; }
    .stmt-table td { padding: 4px 0; }
    .stmt-table td.col-amt { width: 120px; }
    .stmt-table td.col-pct { width: 62px; }

    tr.sec-head td { background: transparent; padding: 11px 0 4px; font-size: 8.5pt; }
    tr.net-row td  { background: transparent; font-size: 11.5pt; }
    tr.line-row { cursor: default; }
    tr.line-row td.col-label { padding-left: 14px; }

    /* Drill-down, chevrons, txn counts, row actions never print. */
    tr.detail-row,
    tr.line-row .chev,
    .txn-count,
    .mini-btn { display: none !important; }

    /* Keep a heading with its first line; keep a subtotal with its section. */
    tr { break-inside: avoid; page-break-inside: avoid; }
    tr.sec-head { break-after: avoid; page-break-after: avoid; }
    tr.subtotal-row, tr.net-row { break-before: avoid; page-break-before: avoid; }

    /* Parentheses already carry the sign — red ink adds nothing on paper. */
    .is-negative { color: #000; }

    .footnote { font-size: 8.5pt; color: #555; margin-top: 14px; }
  }
</style>
</head>

<body class="pre-auth">

  <div class="page-title-row" aria-hidden="true">
    <h1 class="page-title">P&amp;L overview</h1>
    <span class="page-title-meta">
      <span class="hdr-basis">Accrual · calendar year</span>
      <button type="button" class="hdr-btn" id="printBtn">Print / PDF</button>
      <a class="hdr-btn is-quiet" href="/statement-review/">Statement review</a>
      <a class="hdr-btn" href="/pl-overview/payroll/">Payroll upload</a>
      <a class="hdr-btn" href="/pl-overview/categories/">Categories</a>
    </span>
  </div>

  <main class="page-body" id="pageBody">

    <div class="print-head" id="printHead">
      <div class="ph-co">Popcorn Chez LLC</div>
      <div class="ph-title">Profit &amp; Loss</div>
      <div class="ph-basis">Accrual Basis</div>
      <div class="ph-range" id="printRange"></div>
    </div>

    <div class="chip-row" id="chipRow">
      <button type="button" class="chip is-active" data-chip="ytd">Year to date</button>
      <button type="button" class="chip" data-chip="this-month">This month</button>
      <button type="button" class="chip" data-chip="last-month">Last month</button>
      <button type="button" class="chip" data-chip="this-quarter">This quarter</button>
      <button type="button" class="chip" data-chip="custom">Custom</button>
      <span class="chip-range" id="chipRangeWrap" hidden>
        <input type="date" id="chipFrom" aria-label="From date">
        <span>&rarr;</span>
        <input type="date" id="chipTo" aria-label="To date">
      </span>
    </div>

    <div class="range-banner" id="rangeBanner">Loading&hellip;</div>

    <div class="warn-strip" id="warnStrip" hidden></div>

    <div class="stmt-card">
      <div id="stmtHost">
        <div class="stmt-loading" id="stmtLoading">Loading transactions&hellip;</div>
      </div>
    </div>

    <div class="footnote" id="footnote"></div>

  </main>

  <div class="pc-toast-host" id="pcToastHost" aria-live="polite" aria-atomic="true"></div>
  <div class="modal-backdrop" id="modalBackdrop"></div>

<script>
(function () {
  'use strict';

  var SB_URL  = 'https://aoazlttdjowhlfcksoyl.supabase.co';
  var SB_REST = SB_URL + '/rest/v1/';

  var DETAIL_CAP = 60;   // rows shown per expanded line before "+N more"

  // Two vocabularies live in this map. 2026+ revenue keys off
  // ar_items.income_category (lowercase snake). 2025 was loaded as
  // pl_manual_entries against expense_categories, so its keys are the
  // category names themselves. Both have to resolve or the statement
  // prints raw category names.
  var REVENUE_LABELS = {
    sales:               'Sales',
    labor_reimbursement: 'Labor reimbursement',
    tips:                'Tips (pass-through)',
    fees:                'Fees',
    tax:                 'Tax',
    adjustment:          'Adjustments',
    'Food Sales':            'Food sales',
    'Service Sales - Other': 'Service sales \u2014 other',
    'Employee Tips':         'Employee tips'
  };
  var REVENUE_ORDER = ['sales', 'Food Sales', 'labor_reimbursement',
                       'Service Sales - Other', 'tips', 'Employee Tips',
                       'fees', 'tax', 'adjustment'];

  // Labor lines are synthesized by the view with these exact category names.
  // Also the display order for the Labor section — fixed order beats sorting
  // by size, which would reshuffle the statement as the season swings.
  var LABOR_LABELS = ['Variable labor (hourly)', 'Company labor (unallocated)',
                      'Fixed labor (salaried)', 'Employer payroll taxes',
                      'Contract Labor (1099)', 'Wages & overtime', 'Tips paid out'];

  var state = {
    chip: 'ytd',
    from: null,
    to:   null,
    rows: [],
    openKeys: {},
    loading: true
  };

  // =====================================================================
  // UTILITIES
  // =====================================================================
  function pad2(n) { n = String(n); return n.length < 2 ? '0' + n : n; }

  function todayIso() {
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    var p = String(iso).split('-');
    if (p.length < 3) return iso;
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return (months[parseInt(p[1], 10) - 1] || '') + ' ' + parseInt(p[2], 10) + ', ' + p[0];
  }

  function fmtDateShort(iso) {
    if (!iso) return '—';
    var p = String(iso).split('-');
    if (p.length < 3) return iso;
    return parseInt(p[1], 10) + '/' + parseInt(p[2], 10) + '/' + p[0].slice(2);
  }

  /** Accounting format: negatives in parentheses, never a minus sign. */
  function fmtMoney(n) {
    if (n == null || isNaN(n)) n = 0;
    var abs = Math.abs(n);
    var s = '$' + abs.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return n < 0 ? '(' + s + ')' : s;
  }

  function fmtPct(n) {
    if (n == null || isNaN(n) || !isFinite(n)) return '';
    return (Math.round(n * 10) / 10).toFixed(1) + '%';
  }

  function esc(s) {
    if (s == null) return '';
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function showToast(msg, ms) {
    ms = ms || 2400;
    var host = document.getElementById('pcToastHost');
    if (!host) return;
    var el = document.createElement('div');
    el.className = 'pc-toast';
    el.textContent = msg;
    host.appendChild(el);
    requestAnimationFrame(function () { el.classList.add('is-shown'); });
    setTimeout(function () {
      el.classList.remove('is-shown');
      setTimeout(function () { el.remove(); }, 260);
    }, ms);
  }

  function handleAuthFailure() {
    try {
      localStorage.removeItem('sb_access_token');
      localStorage.removeItem('sb_refresh_token');
    } catch (e) { /* ignore */ }
    showToast('Session expired. Reloading…', 1800);
    setTimeout(function () { window.location.reload(); }, 1800);
  }

  function authFetch(url, options) {
    return fetch(url, options).then(function (r) {
      if (!r.ok) {
        return r.text().then(function (t) {
          if (r.status === 401 || (t && t.indexOf('JWT expired') !== -1)) {
            var ae = new Error('JWT expired');
            ae.authFailed = true;
            throw ae;
          }
          throw new Error(t || ('HTTP ' + r.status));
        });
      }
      return r.text().then(function (t) {
        if (!t) return [];
        try { return JSON.parse(t); } catch (e) { return []; }
      });
    });
  }

  // =====================================================================
  // DATE RANGE
  // Calendar year, not fiscal — pc-fiscal's CY2026 starts Jan 5 and would
  // silently drop Jan 1-4 from a tax P&L.
  // =====================================================================
  function resolveRange(chip) {
    var today = todayIso();
    var y  = parseInt(today.slice(0, 4), 10);
    var m  = parseInt(today.slice(5, 7), 10);

    function monthStart(yy, mm) { return yy + '-' + pad2(mm) + '-01'; }
    function monthEnd(yy, mm) {
      var d = new Date(yy, mm, 0);   // day 0 of next month = last day of this
      return yy + '-' + pad2(mm) + '-' + pad2(d.getDate());
    }

    if (chip === 'ytd') {
      return { from: y + '-01-01', to: today, label: 'Year to date' };
    }
    if (chip === 'this-month') {
      return { from: monthStart(y, m), to: monthEnd(y, m), label: 'This month' };
    }
    if (chip === 'last-month') {
      var ly = m === 1 ? y - 1 : y;
      var lm = m === 1 ? 12 : m - 1;
      return { from: monthStart(ly, lm), to: monthEnd(ly, lm), label: 'Last month' };
    }
    if (chip === 'this-quarter') {
      var qStart = Math.floor((m - 1) / 3) * 3 + 1;
      return { from: monthStart(y, qStart), to: monthEnd(y, qStart + 2), label: 'This quarter' };
    }
    if (chip === 'custom') {
      if (!state.from || !state.to) return null;
      return { from: state.from, to: state.to, label: 'Custom range' };
    }
    return null;
  }

  // =====================================================================
  // FETCH
  // =====================================================================
  function fetchTransactions(fromIso, toIso) {
    var url = SB_REST + 'v_pl_transactions?' + [
      'select=source_table,source_id,txn_date,amount,category_id,category_name,' +
        'gl_group,description,venue_code,is_split,editable',
      'txn_date=gte.' + encodeURIComponent(fromIso),
      'txn_date=lte.' + encodeURIComponent(toIso),
      'order=txn_date.desc',
      'limit=50000'
    ].join('&');
    return authFetch(url, { headers: pcAuth.headers() });
  }

  // =====================================================================
  // AGGREGATION
  // =====================================================================

  /** Group rows into { key -> { label, total, rows[] } }, preserving order. */
  function groupBy(rows, keyFn, labelFn) {
    var out = {};
    rows.forEach(function (r) {
      var k = keyFn(r);
      if (!out[k]) out[k] = { key: k, label: labelFn(r, k), total: 0, rows: [] };
      out[k].total += Number(r.amount || 0);
      out[k].rows.push(r);
    });
    return out;
  }

  function sumOf(rows) {
    var t = 0;
    rows.forEach(function (r) { t += Number(r.amount || 0); });
    return Math.round(t * 100) / 100;
  }

  function buildStatement() {
    var rows = state.rows;

    var revenue    = rows.filter(function (r) { return r.gl_group === 'revenue'; });
    var cogs       = rows.filter(function (r) { return r.gl_group === 'cogs'; });
    var allExpense = rows.filter(function (r) { return r.gl_group === 'expense'; });
    var nonPl      = rows.filter(function (r) { return r.gl_group === 'non_pl'; });

    // Labor is a presentation split of gl_group='expense' — the view emits
    // payroll with these exact category names.
    var labor = allExpense.filter(function (r) {
      return LABOR_LABELS.indexOf(r.category_name) !== -1;
    });
    var opex = allExpense.filter(function (r) {
      return LABOR_LABELS.indexOf(r.category_name) === -1;
    });

    var revenueTotal = sumOf(revenue);
    var cogsTotal    = sumOf(cogs);
    var laborTotal   = sumOf(labor);
    var opexTotal    = sumOf(opex);

    // Tips are a pass-through: billed to the client, paid out through payroll.
    // Both sides belong on the tax return, but neither belongs in the
    // denominator of a percentage — including them inflates revenue and makes
    // every ratio look better than it is. All percentages use OPERATING
    // revenue (revenue less tips) as the basis.
    var tipsIn = sumOf(revenue.filter(function (r) {
      return r.category_name === 'tips';
    }));
    var tipsOut = sumOf(labor.filter(function (r) {
      return r.category_name === 'Tips paid out';
    }));
    var operatingRevenue = Math.round((revenueTotal - tipsIn) * 100) / 100;

    return {
      tipsIn:           tipsIn,
      tipsOut:          tipsOut,
      operatingRevenue: operatingRevenue,
      revenue:      groupBy(revenue, function (r) { return r.category_name || 'uncategorized'; },
                            function (r, k) { return REVENUE_LABELS[k] || k; }),
      cogs:         groupBy(cogs, function () { return 'cogs'; },
                            function () { return 'Food & supplies'; }),
      labor:        groupBy(labor, function (r) { return r.category_name; },
                            function (r) { return r.category_name; }),
      opex:         groupBy(opex, function (r) { return r.category_name || '(uncategorized)'; },
                            function (r) { return r.category_name || '(uncategorized)'; }),
      nonPl:        groupBy(nonPl, function (r) { return r.category_name || '(uncategorized)'; },
                            function (r) { return r.category_name || '(uncategorized)'; }),
      revenueTotal: revenueTotal,
      cogsTotal:    cogsTotal,
      laborTotal:   laborTotal,
      opexTotal:    opexTotal,
      // Stated on the operating-revenue basis so it's comparable to COS %.
      // Tips are excluded from both sides; they pass through to net income
      // via the revenue and labor lines, netting to zero once payroll loads.
      grossProfit:  Math.round((operatingRevenue + cogsTotal) * 100) / 100,
      netIncome:    Math.round((revenueTotal + cogsTotal + laborTotal + opexTotal) * 100) / 100,
      hasPayroll:   labor.length > 0
    };
  }

  // =====================================================================
  // RENDER
  // =====================================================================
  function pctOfRevenue(amount, revenueTotal) {
    if (!revenueTotal) return '';
    return fmtPct(Math.abs(amount) / Math.abs(revenueTotal) * 100);
  }

  /** Ordered array of groups, largest magnitude first. */
  function sortedGroups(groupMap, explicitOrder) {
    var arr = Object.keys(groupMap).map(function (k) { return groupMap[k]; });
    if (explicitOrder) {
      arr.sort(function (a, b) {
        var ia = explicitOrder.indexOf(a.key);
        var ib = explicitOrder.indexOf(b.key);
        if (ia === -1) ia = 999;
        if (ib === -1) ib = 999;
        return ia - ib;
      });
    } else {
      arr.sort(function (a, b) { return Math.abs(b.total) - Math.abs(a.total); });
    }
    return arr;
  }

  function lineRowHtml(group, revenueTotal, sectionKey) {
    var key = sectionKey + '::' + group.key;
    var isOpen = !!state.openKeys[key];
    var neg = group.total < 0;
    var count = group.rows.length;

    var html = '<tr class="line-row' + (isOpen ? ' is-open' : '') + '" data-key="' + esc(key) + '">' +
      '<td class="col-label"><span class="chev">&#9654;</span>' + esc(group.label) +
        ' <span class="is-muted txn-count" style="font-size:11.5px;">' + count +
        (count === 1 ? ' txn' : ' txns') + '</span></td>' +
      '<td class="col-amt' + (neg ? ' is-negative' : '') + '">' + esc(fmtMoney(group.total)) + '</td>' +
      '<td class="col-pct">' + pctOfRevenue(group.total, revenueTotal) + '</td>' +
    '</tr>';

    if (isOpen) html += detailRowHtml(group);
    return html;
  }

  function detailRowHtml(group) {
    var rows = group.rows.slice().sort(function (a, b) {
      return Math.abs(Number(b.amount || 0)) - Math.abs(Number(a.amount || 0));
    });
    var shown = rows.slice(0, DETAIL_CAP);

    var inner = '<table class="detail-table"><thead><tr>' +
      '<th>Date</th><th>Description</th><th>Venue</th><th>Source</th>' +
      '<th class="is-amt">Amount</th><th class="is-act"></th>' +
      '</tr></thead><tbody>';

    shown.forEach(function (r) {
      var amt = Number(r.amount || 0);
      var src = String(r.source_table || '').replace('split:', '').replace(/_/g, ' ');
      // Only rows the view marks editable can be recategorized. AR-sourced
      // revenue is corrected in Accounts Receivable, and payroll in its own
      // upload — changing them here would put the P&L out of step with them.
      var acts = '';
      if (r.editable) {
        acts = '<button type="button" class="mini-btn" data-act="recat" ' +
                 'data-st="' + esc(r.source_table) + '" data-sid="' + esc(r.source_id) + '">Category</button>' +
               (r.is_split
                 ? ''
                 : '<button type="button" class="mini-btn" data-act="split" ' +
                   'data-st="' + esc(r.source_table) + '" data-sid="' + esc(r.source_id) + '" ' +
                   'data-amt="' + esc(amt) + '" data-desc="' + esc(r.description || '') + '">Split</button>');
      }
      inner += '<tr>' +
        '<td class="d-date">' + esc(fmtDateShort(r.txn_date)) + '</td>' +
        '<td>' + esc(r.description || '—') +
          (r.is_split ? '<span class="split-tag">SPLIT</span>' : '') + '</td>' +
        '<td class="d-venue">' + esc(r.venue_code || '—') + '</td>' +
        '<td class="d-src">' + esc(src) + '</td>' +
        '<td class="d-amt' + (amt < 0 ? ' is-negative' : '') + '">' + esc(fmtMoney(amt)) + '</td>' +
        '<td class="d-act">' + acts + '</td>' +
      '</tr>';
    });

    inner += '</tbody></table>';

    if (rows.length > shown.length) {
      inner += '<div class="detail-more">+ ' + (rows.length - shown.length) +
        ' more, largest ' + DETAIL_CAP + ' shown</div>';
    }

    return '<tr class="detail-row"><td colspan="3"><div class="detail-wrap">' + inner + '</div></td></tr>';
  }

  function sectionHeadHtml(label) {
    return '<tr class="sec-head"><td colspan="3">' + esc(label) + '</td></tr>';
  }

  function totalRowHtml(label, amount, revenueTotal, cls) {
    var neg = amount < 0;
    return '<tr class="' + (cls || 'subtotal-row') + '">' +
      '<td>' + esc(label) + '</td>' +
      '<td class="col-amt' + (neg ? ' is-negative' : '') + '">' + esc(fmtMoney(amount)) + '</td>' +
      '<td class="col-pct">' + pctOfRevenue(amount, revenueTotal) + '</td>' +
    '</tr>';
  }

  function renderStatement() {
    var host = document.getElementById('stmtHost');
    if (!host) return;

    if (state.rows.length === 0) {
      host.innerHTML = '<div class="stmt-empty">No transactions in this date range.</div>';
      return;
    }

    var s = buildStatement();
    // Percentage basis = operating revenue, NOT total revenue. See buildStatement.
    var rt = s.operatingRevenue;
    var html = '<table class="stmt-table"><tbody>';

    // REVENUE
    html += sectionHeadHtml('Revenue');
    sortedGroups(s.revenue, REVENUE_ORDER).forEach(function (g) {
      // Tips carry no percentage — they're excluded from the basis.
      html += lineRowHtml(g, g.key === 'tips' ? 0 : rt, 'rev');
    });
    html += totalRowHtml('Total revenue', s.revenueTotal, 0);
    if (Math.abs(s.tipsIn) > 0.005) {
      html += totalRowHtml('Operating revenue \u2014 excludes tips', rt, 0);
    }

    // COST OF SALES
    html += '<tr class="spacer-row"><td colspan="3"></td></tr>';
    html += sectionHeadHtml('Cost of sales');
    sortedGroups(s.cogs).forEach(function (g) {
      html += lineRowHtml(g, rt, 'cogs');
    });
    html += totalRowHtml('Gross profit', s.grossProfit, rt);

    // LABOR
    html += '<tr class="spacer-row"><td colspan="3"></td></tr>';
    html += sectionHeadHtml('Labor');
    if (s.hasPayroll) {
      sortedGroups(s.labor, LABOR_LABELS).forEach(function (g) {
        // Tips paid out is the offset to tips billed — no percentage.
        html += lineRowHtml(g, g.key === 'Tips paid out' ? 0 : rt, 'labor');
      });
      // Total labor excludes tips from its ratio so labor % stays comparable
      // to what COS & Labor reports.
      html += totalRowHtml('Total labor', s.laborTotal, rt);
      if (Math.abs(s.tipsOut) > 0.005) {
        html += totalRowHtml('Labor excluding tips',
          Math.round((s.laborTotal - s.tipsOut) * 100) / 100, rt);
      }
    } else {
      html += '<tr class="line-row" style="cursor:default;">' +
        '<td class="col-label is-muted"><em>No payroll loaded for this period</em></td>' +
        '<td class="col-amt is-muted">$0.00</td><td class="col-pct"></td></tr>';
    }

    // OPERATING EXPENSES
    html += '<tr class="spacer-row"><td colspan="3"></td></tr>';
    html += sectionHeadHtml('Operating expenses');
    sortedGroups(s.opex).forEach(function (g) {
      html += lineRowHtml(g, rt, 'opex');
    });
    html += totalRowHtml('Total operating expenses', s.opexTotal, rt);

    // NET
    html += '<tr class="spacer-row"><td colspan="3"></td></tr>';
    html += totalRowHtml('NET INCOME', s.netIncome, rt, 'net-row');

    // BELOW THE LINE
    var nonPlGroups = sortedGroups(s.nonPl);
    if (nonPlGroups.length > 0) {
      html += '<tr class="spacer-row"><td colspan="3"></td></tr>';
      html += sectionHeadHtml('Below the line — does not affect net income');
      nonPlGroups.forEach(function (g) {
        html += lineRowHtml(g, rt, 'nonpl');
      });
    }

    html += '</tbody></table>';
    host.innerHTML = html;

    renderWarnings(s);
    renderFootnote(s);
  }

  /**
   * Surfaces what the reader would otherwise have to already know. Silence
   * here would be worse than noise — a P&L missing payroll looks profitable.
   */
  function renderWarnings(s) {
    var el = document.getElementById('warnStrip');
    if (!el) return;

    var items = [];

    if (!s.hasPayroll) {
      items.push('<strong>Payroll is not loaded.</strong> Wages, employer taxes, and tips paid out are ' +
        'missing entirely, so net income is overstated by the full cost of labor.');
    }

    var uncat = s.opex['(uncategorized)'];
    if (uncat) {
      items.push('<strong>' + uncat.rows.length + ' transaction' +
        (uncat.rows.length === 1 ? '' : 's') + ' with no category</strong> totalling ' +
        esc(fmtMoney(uncat.total)) + '.');
    }

    var misc = s.opex['Miscellaneous'];
    if (misc && Math.abs(misc.total) > 1000) {
      items.push('<strong>Miscellaneous holds ' + esc(fmtMoney(misc.total)) + '</strong> across ' +
        misc.rows.length + ' transaction' + (misc.rows.length === 1 ? '' : 's') +
        '. Large balances here usually mean loan movement or transfers that belong below the line.');
    }

    var tipsIn = s.revenue['tips'];
    var tipsOut = s.labor['Tips paid out'];
    if (tipsIn && !tipsOut) {
      items.push('<strong>' + esc(fmtMoney(tipsIn.total)) + ' of tips billed</strong> with no matching ' +
        'payout recorded. Tips are pass-through — the offsetting cost arrives with payroll.');
    }

    if (items.length === 0) { el.hidden = true; el.innerHTML = ''; return; }
    el.hidden = false;
    el.innerHTML = 'Read this before trusting the numbers:<ul><li>' +
      items.join('</li><li>') + '</li></ul>';
  }

  function renderFootnote(s) {
    var el = document.getElementById('footnote');
    if (!el) return;
    var n = state.rows.length;
    var basisNote = Math.abs(s.tipsIn) > 0.005
      ? 'Percentages are against <strong>operating revenue</strong> (' +
        esc(fmtMoney(s.operatingRevenue)) + '), which excludes ' +
        esc(fmtMoney(s.tipsIn)) + ' of tips \u2014 tips are collected and paid out, ' +
        'so counting them would flatter every ratio. '
      : '';
    el.innerHTML = '<strong>' + n.toLocaleString('en-US') + '</strong> transactions. ' + basisNote +
      'Accrual basis \u2014 revenue at invoice date, costs at invoice or pay-period date. ' +
      'Settlement rows (checks clearing, payroll funding, transfers between accounts) are ' +
      'excluded so nothing is counted twice. Operating expenses have no venue attribution in the ' +
      'source data, so the venue column is blank for those rows.';
  }

  function renderRangeBanner(range) {
    var pr = document.getElementById('printRange');
    if (pr) {
      pr.textContent = range
        ? 'For the period ' + fmtDate(range.from) + ' through ' + fmtDate(range.to)
        : '';
    }
    var el = document.getElementById('rangeBanner');
    if (!el) return;
    if (!range) { el.textContent = 'Pick a custom date range to load the report.'; return; }
    el.innerHTML = '<strong>' + esc(range.label) + '</strong> \u00b7 ' +
      esc(fmtDate(range.from)) + ' \u2013 ' + esc(fmtDate(range.to));
  }

  // =====================================================================
  // SESSION 3 — RECATEGORIZE + SPLIT
  //
  // Two write paths, deliberately different:
  //
  //   Recategorize → PATCH the source row's category_id. Simple, reversible,
  //   and the source table stays the single owner of its own classification.
  //
  //   Split → INSERT rows into pl_txn_splits. The source row is NEVER
  //   mutated; the view's NOT EXISTS clause hides it and the split rows
  //   stand in its place. Deleting the splits restores the original in full.
  //   This is what makes a loan payback expressible: $25,000 to principal
  //   (non_pl) and $2,500 to interest (expense), from one $27,500 check.
  // =====================================================================

  var categories = [];        // active expense_categories, for both pickers
  var editCtx = null;         // { source_table, source_id, amount, description }
  var splitLines = [];        // [{ category_id, amount }]
  var submitting = false;

  function fetchCategories() {
    return authFetch(
      SB_REST + 'expense_categories?select=id,name,gl_group,sort_order' +
      '&is_active=eq.true&order=gl_group.asc,sort_order.asc,name.asc&limit=500',
      { headers: pcAuth.headers() }
    ).then(function (rows) { categories = rows || []; return categories; });
  }

  var GROUP_LABELS = {
    cogs:       'Cost of sales',
    expense:    'Operating expense',
    non_pl:     'Non-P&L (below the line)',
    settlement: 'Settlement (off the P&L)'
  };

  /** <optgroup>-organised category options so gl_group is visible at pick time. */
  function categoryOptionsHtml(selectedId) {
    var byGroup = {};
    categories.forEach(function (c) {
      if (!byGroup[c.gl_group]) byGroup[c.gl_group] = [];
      byGroup[c.gl_group].push(c);
    });
    var html = '<option value="">Select a category\u2026</option>';
    ['cogs', 'expense', 'non_pl', 'settlement'].forEach(function (g) {
      if (!byGroup[g]) return;
      html += '<optgroup label="' + esc(GROUP_LABELS[g] || g) + '">';
      byGroup[g].forEach(function (c) {
        html += '<option value="' + esc(c.id) + '"' +
          (c.id === selectedId ? ' selected' : '') + '>' + esc(c.name) + '</option>';
      });
      html += '</optgroup>';
    });
    return html;
  }

  function closeModal() {
    var bd = document.getElementById('modalBackdrop');
    if (!bd) return;
    bd.classList.remove('is-open');
    bd.innerHTML = '';
    editCtx = null;
    splitLines = [];
  }

  function findRow(sourceTable, sourceId) {
    for (var i = 0; i < state.rows.length; i++) {
      var r = state.rows[i];
      if (r.source_table === sourceTable && String(r.source_id) === String(sourceId)) return r;
    }
    return null;
  }

  // ---------------------------------------------------------------------
  // RECATEGORIZE
  // ---------------------------------------------------------------------
  function openRecatModal(sourceTable, sourceId) {
    var row = findRow(sourceTable, sourceId);
    if (!row) return;
    var bd = document.getElementById('modalBackdrop');
    if (!bd) return;

    editCtx = {
      source_table: sourceTable,
      source_id:    sourceId,
      amount:       Number(row.amount || 0),
      description:  row.description || ''
    };

    // purchases rows carry no category_id — they're COS by definition — so
    // the picker opens unset rather than pretending to know.
    var currentId = row.category_id || '';

    bd.innerHTML =
      '<div class="modal-card" role="dialog">' +
        '<div class="modal-head">' +
          '<div>' +
            '<div class="modal-title">Change category</div>' +
            '<div class="modal-subtitle">' + esc(fmtDateShort(row.txn_date)) + ' \u00b7 ' +
              esc(row.description || '') + '</div>' +
          '</div>' +
          '<button type="button" class="modal-close" data-act="close">\u00d7</button>' +
        '</div>' +
        '<div class="modal-body">' +
          '<div class="txn-summary">Currently in <strong>' + esc(row.category_name || '\u2014') +
            '</strong><span class="amt">' + esc(fmtMoney(editCtx.amount)) + '</span></div>' +
          '<div class="m-field">' +
            '<label for="recatSel">Move to</label>' +
            '<select id="recatSel">' + categoryOptionsHtml(currentId) + '</select>' +
            '<div class="m-hint">Non-P&amp;L and Settlement categories keep the transaction ' +
              'visible and reconciled to the bank, but take it out of net income.</div>' +
          '</div>' +
        '</div>' +
        '<div class="modal-footer">' +
          '<div class="right">' +
            '<button type="button" class="btn-secondary" data-act="close">Cancel</button>' +
            '<button type="button" class="btn-primary" id="recatSave">Save</button>' +
          '</div>' +
        '</div>' +
      '</div>';

    bd.classList.add('is-open');
    var sel = document.getElementById('recatSel');
    if (sel) sel.focus();
    var save = document.getElementById('recatSave');
    if (save) save.addEventListener('click', handleRecatSave);
  }

  function handleRecatSave() {
    if (submitting || !editCtx) return;
    var sel = document.getElementById('recatSel');
    var btn = document.getElementById('recatSave');
    if (!sel) return;
    var catId = sel.value;
    if (!catId) { showToast('Pick a category', 2000); return; }

    // purchases has no category_id column — recategorizing one out of COS
    // means splitting it, not patching it. Guard rather than 400.
    if (editCtx.source_table === 'purchases') {
      showToast('Purchases are cost of sales by definition \u2014 use Split to reclassify part of one', 4000);
      return;
    }

    var table = editCtx.source_table === 'pl_manual_entries' ? 'pl_manual_entries' : 'expenses';

    submitting = true;
    if (btn) { btn.disabled = true; btn.textContent = 'Saving\u2026'; }

    var hdrs = Object.assign({}, pcAuth.headers(), {
      'Content-Type': 'application/json', 'Prefer': 'return=minimal'
    });

    authFetch(SB_REST + table + '?id=eq.' + encodeURIComponent(editCtx.source_id), {
      method: 'PATCH', headers: hdrs, body: JSON.stringify({ category_id: catId })
    })
    .then(function () {
      closeModal();
      return reload().then(function () { showToast('Category updated', 2000); });
    })
    .catch(function (e) {
      if (e && e.authFailed) { handleAuthFailure(); return; }
      console.error('[pl-overview] recategorize failed:', e);
      showToast('Could not update \u00b7 ' + ((e && e.message) || 'unknown').substring(0, 100), 4000);
      if (btn) { btn.disabled = false; btn.textContent = 'Save'; }
    })
    .then(function () { submitting = false; });
  }

  // ---------------------------------------------------------------------
  // SPLIT
  // ---------------------------------------------------------------------
  function openSplitModal(sourceTable, sourceId) {
    var row = findRow(sourceTable, sourceId);
    if (!row) return;
    var bd = document.getElementById('modalBackdrop');
    if (!bd) return;

    editCtx = {
      source_table: sourceTable,
      source_id:    sourceId,
      amount:       Number(row.amount || 0),
      description:  row.description || ''
    };

    // Two blank lines to start — a one-line split is just a recategorization.
    splitLines = [
      { category_id: '', amount: '' },
      { category_id: '', amount: '' }
    ];

    bd.innerHTML =
      '<div class="modal-card" role="dialog">' +
        '<div class="modal-head">' +
          '<div>' +
            '<div class="modal-title">Split transaction</div>' +
            '<div class="modal-subtitle">' + esc(fmtDateShort(row.txn_date)) + ' \u00b7 ' +
              esc(row.description || '') + '</div>' +
          '</div>' +
          '<button type="button" class="modal-close" data-act="close">\u00d7</button>' +
        '</div>' +
        '<div class="modal-body">' +
          '<div class="txn-summary">Splitting<span class="amt">' +
            esc(fmtMoney(editCtx.amount)) + '</span></div>' +
          '<div class="split-hdr"><div>Category</div><div class="h-amt">Amount</div><div></div></div>' +
          '<div id="splitLines"></div>' +
          '<button type="button" class="split-add" id="splitAdd">+ Add line</button>' +
          '<div class="split-status under" id="splitStatus"></div>' +
          '<div class="m-hint" style="margin-top:10px;">The original stays untouched \u2014 these lines ' +
            'stand in for it on the P&amp;L. Remove the split and the original returns.</div>' +
        '</div>' +
        '<div class="modal-footer">' +
          '<div class="right">' +
            '<button type="button" class="btn-secondary" data-act="close">Cancel</button>' +
            '<button type="button" class="btn-primary" id="splitSave">Save split</button>' +
          '</div>' +
        '</div>' +
      '</div>';

    bd.classList.add('is-open');
    renderSplitLines();

    var add = document.getElementById('splitAdd');
    if (add) add.addEventListener('click', function () {
      splitLines.push({ category_id: '', amount: '' });
      renderSplitLines();
    });
    var save = document.getElementById('splitSave');
    if (save) save.addEventListener('click', handleSplitSave);
  }

  function renderSplitLines() {
    var host = document.getElementById('splitLines');
    if (!host) return;

    host.innerHTML = splitLines.map(function (ln, i) {
      return '<div class="split-line" data-idx="' + i + '">' +
        '<select class="sp-cat" data-idx="' + i + '">' + categoryOptionsHtml(ln.category_id) + '</select>' +
        '<input type="text" class="sp-amt" data-idx="' + i + '" value="' + esc(ln.amount) +
          '" placeholder="0.00" inputmode="decimal">' +
        (splitLines.length > 2
          ? '<button type="button" class="split-rm" data-idx="' + i + '">\u00d7</button>'
          : '<span></span>') +
      '</div>';
    }).join('');

    host.addEventListener('change', onSplitInput);
    host.addEventListener('input', onSplitInput);
    host.addEventListener('click', function (ev) {
      var t = ev.target;
      if (!t || !t.classList || !t.classList.contains('split-rm')) return;
      var idx = parseInt(t.getAttribute('data-idx'), 10);
      if (isNaN(idx)) return;
      splitLines.splice(idx, 1);
      renderSplitLines();
    });

    updateSplitStatus();
  }

  function onSplitInput(ev) {
    var t = ev.target;
    if (!t || !t.getAttribute) return;
    var idx = parseInt(t.getAttribute('data-idx'), 10);
    if (isNaN(idx) || !splitLines[idx]) return;
    if (t.classList.contains('sp-cat')) splitLines[idx].category_id = t.value;
    else if (t.classList.contains('sp-amt')) splitLines[idx].amount = t.value;
    updateSplitStatus();
  }

  /** Magnitudes only — the sign comes from the source row on save. */
  function splitAllocated() {
    var t = 0;
    splitLines.forEach(function (ln) {
      var n = parseFloat(String(ln.amount).replace(/[$,\s]/g, ''));
      if (!isNaN(n)) t += Math.abs(n);
    });
    return Math.round(t * 100) / 100;
  }

  function updateSplitStatus() {
    var el = document.getElementById('splitStatus');
    var btn = document.getElementById('splitSave');
    if (!el || !editCtx) return;

    var target = Math.abs(Math.round(editCtx.amount * 100) / 100);
    var alloc  = splitAllocated();
    var rem    = Math.round((target - alloc) * 100) / 100;

    var ok = Math.abs(rem) < 0.005 && alloc > 0;
    if (ok) {
      el.className = 'split-status ok';
      el.textContent = 'Fully allocated \u2014 ' + fmtMoney(target);
    } else if (rem > 0) {
      el.className = 'split-status under';
      el.textContent = fmtMoney(rem) + ' still to allocate of ' + fmtMoney(target);
    } else {
      el.className = 'split-status over';
      el.textContent = fmtMoney(Math.abs(rem)) + ' over-allocated';
    }

    var allCats = splitLines.every(function (ln) {
      var n = parseFloat(String(ln.amount).replace(/[$,\s]/g, ''));
      return !ln.category_id ? (isNaN(n) || n === 0) : true;
    });
    if (btn) btn.disabled = !(ok && allCats);
  }

  function handleSplitSave() {
    if (submitting || !editCtx) return;
    var btn = document.getElementById('splitSave');

    var sign = editCtx.amount < 0 ? -1 : 1;
    var rows = [];
    var bad = false;

    splitLines.forEach(function (ln, i) {
      var n = parseFloat(String(ln.amount).replace(/[$,\s]/g, ''));
      if (isNaN(n) || Math.abs(n) < 0.005) return;      // blank line, skip
      if (!ln.category_id) { bad = true; return; }
      rows.push({
        source_table: editCtx.source_table,
        source_id:    String(editCtx.source_id),
        category_id:  ln.category_id,
        // The view negates split amounts, so store the magnitude and let
        // the source row's sign decide direction.
        amount:       Math.abs(n) * (sign < 0 ? 1 : -1),
        sort_order:   i,
        created_by:   actorName()
      });
    });

    if (bad)            { showToast('Every line with an amount needs a category', 2600); return; }
    if (rows.length < 2) { showToast('A split needs at least two lines', 2400); return; }

    submitting = true;
    if (btn) { btn.disabled = true; btn.textContent = 'Saving\u2026'; }

    var hdrs = Object.assign({}, pcAuth.headers(), {
      'Content-Type': 'application/json', 'Prefer': 'return=minimal'
    });

    authFetch(SB_REST + 'pl_txn_splits', {
      method: 'POST', headers: hdrs, body: JSON.stringify(rows)
    })
    .then(function () {
      closeModal();
      return reload().then(function () {
        showToast('Split into ' + rows.length + ' lines', 2400);
      });
    })
    .catch(function (e) {
      if (e && e.authFailed) { handleAuthFailure(); return; }
      console.error('[pl-overview] split failed:', e);
      showToast('Could not split \u00b7 ' + ((e && e.message) || 'unknown').substring(0, 100), 4000);
      if (btn) { btn.disabled = false; btn.textContent = 'Save split'; }
    })
    .then(function () { submitting = false; });
  }

  function actorName() {
    try {
      if (typeof pcAuth !== 'undefined' && pcAuth.getUser) {
        var u = pcAuth.getUser();
        return (u && u.display_name) || (u && u.email) || 'unknown';
      }
    } catch (e) { /* ignore */ }
    return 'unknown';
  }

  function wireModal() {
    var bd = document.getElementById('modalBackdrop');
    if (!bd) return;
    bd.addEventListener('click', function (ev) {
      var t = ev.target;
      if (t === bd) { closeModal(); return; }
      if (!t || !t.closest) return;
      if (t.closest('[data-act="close"]')) closeModal();
    });
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') closeModal();
    });
  }

  function wireDetailActions() {
    var host = document.getElementById('stmtHost');
    if (!host) return;
    host.addEventListener('click', function (ev) {
      var t = ev.target;
      if (!t || !t.closest) return;
      var btn = t.closest('[data-act]');
      if (!btn) return;
      // Don't let the click bubble up and collapse the expanded line.
      ev.stopPropagation();
      var act = btn.getAttribute('data-act');
      var st  = btn.getAttribute('data-st');
      var sid = btn.getAttribute('data-sid');
      if (act === 'recat') openRecatModal(st, sid);
      else if (act === 'split') openSplitModal(st, sid);
    });
  }

  // =====================================================================
  // WIRING
  // =====================================================================
  function wireChips() {
    var chipRow   = document.getElementById('chipRow');
    var rangeWrap = document.getElementById('chipRangeWrap');
    var fromEl    = document.getElementById('chipFrom');
    var toEl      = document.getElementById('chipTo');
    if (!chipRow) return;

    chipRow.addEventListener('click', function (ev) {
      var t = ev.target;
      if (!t || !t.closest) return;
      var btn = t.closest('.chip');
      if (!btn) return;
      var chip = btn.getAttribute('data-chip');
      if (!chip) return;

      var chips = chipRow.querySelectorAll('.chip');
      for (var i = 0; i < chips.length; i++) {
        chips[i].classList.toggle('is-active', chips[i] === btn);
      }
      state.chip = chip;
      state.openKeys = {};

      if (chip === 'custom') {
        if (rangeWrap) rangeWrap.hidden = false;
        if (fromEl && !fromEl.value) fromEl.value = state.from || '';
        if (toEl && !toEl.value)     toEl.value   = state.to   || '';
        if (state.from && state.to) reload();
        return;
      }
      if (rangeWrap) rangeWrap.hidden = true;
      reload();
    });

    function onDateChange() {
      if (state.chip !== 'custom') return;
      var f = fromEl ? fromEl.value : '';
      var t = toEl ? toEl.value : '';
      if (!f || !t) return;
      if (f > t) { showToast('"From" must be before "to"', 2200); return; }
      state.from = f;
      state.to   = t;
      reload();
    }
    if (fromEl) fromEl.addEventListener('change', onDateChange);
    if (toEl)   toEl.addEventListener('change', onDateChange);
  }

  function wireExpand() {
    var host = document.getElementById('stmtHost');
    if (!host) return;
    host.addEventListener('click', function (ev) {
      var t = ev.target;
      if (!t || !t.closest) return;
      var row = t.closest('tr.line-row[data-key]');
      if (!row) return;
      var key = row.getAttribute('data-key');
      if (!key) return;
      if (state.openKeys[key]) delete state.openKeys[key];
      else state.openKeys[key] = true;
      renderStatement();
    });
  }

  // =====================================================================
  // RELOAD
  // =====================================================================
  function reload() {
    var range = resolveRange(state.chip);
    renderRangeBanner(range);

    if (!range) {
      state.rows = [];
      var host0 = document.getElementById('stmtHost');
      if (host0) host0.innerHTML = '<div class="stmt-empty">Pick both dates to load the statement.</div>';
      return;
    }

    var host = document.getElementById('stmtHost');
    if (host) host.innerHTML = '<div class="stmt-loading">Loading transactions\u2026</div>';
    var warn = document.getElementById('warnStrip');
    if (warn) warn.hidden = true;

    return fetchTransactions(range.from, range.to)
      .then(function (rows) {
        state.rows = rows || [];
        renderStatement();
      })
      .catch(function (e) {
        if (e && e.authFailed) { handleAuthFailure(); return; }
        console.error('[pl-overview] load failed:', e);
        state.rows = [];
        var h = document.getElementById('stmtHost');
        if (h) h.innerHTML = '<div class="stmt-empty">Could not load transactions. ' +
          esc((e && e.message) ? e.message.substring(0, 120) : '') + '</div>';
      });
  }

  // =====================================================================
  // BOOT
  // =====================================================================
  function onAuthReady(user) {
    if (typeof pcActivity !== 'undefined' && pcActivity.init) pcActivity.init('pl-overview');
    document.body.classList.remove('pre-auth');

    var isAdmin = (typeof pcAuth !== 'undefined' && pcAuth.isAdmin) ? pcAuth.isAdmin() : false;
    if (!isAdmin) {
      document.getElementById('pageBody').innerHTML =
        '<div class="access-denied"><h2>Admins only</h2>' +
        '<p>The P&amp;L covers the whole company. If you need access, ask Keith.</p></div>';
      return;
    }

    wireChips();
    wireExpand();
    wireDetailActions();
    wireModal();

    var printBtn = document.getElementById('printBtn');
    if (printBtn) printBtn.addEventListener('click', function () { window.print(); });

    fetchCategories().catch(function (e) {
      if (e && e.authFailed) { handleAuthFailure(); return; }
      console.warn('[pl-overview] categories unavailable, editing disabled:', e);
    });
    reload();

    void user;
  }

  if (typeof pcAuth === 'undefined' || !pcAuth.require) {
    document.body.innerHTML =
      '<div style="padding:60px 22px;font-family:DM Sans,sans-serif;">' +
      '<h1>Authentication unavailable</h1>' +
      '<p>pc-auth.js failed to load. Check the network tab.</p></div>';
  } else {
    pcAuth.require({
      pageSlug: 'pl-overview',
      onReady:  onAuthReady
    });
  }

})();
</script>
